काला-अज़ार, JE और मच्छर नियंत्रण","lessons":[{"id":"vbd.malaria","title":"मलेरिया","cards":[{"title":"मलेरिया कैसे फैलता है","text":"मलेरिया मादा एनोफिलीज़ मच्छर के काटने से फैलता है, जो रात में काटता है। लक्षण: ठंड और कँपकँपी के साथ बुखार, पसीना, सिरदर्द और बदन दर्द। बुखार एक दिन छोड़कर आ सकता है।","tip":"मलेरिया वाले क्षेत्र में हर बुखार में मलेरिया का सोचें।"},{"title":"हर बुखार की जाँच","text":"अपने प्रशिक्षण के अनुसार हर बुखार के मरीज़ की रैपिड डायग्नोस्टिक टेस्ट (RDT) से जाँच करें और ब्लड स्लाइड भी बनाएँ। बुखार के 24 घंटे के अंदर जाँच करें। बुखार रजिस्टर में दर्ज करें।","tip":"RDT किट की एक्सपायरी तारीख देखें।"},{"title":"पूरा इलाज करें","text":"अपनी किट के उम्र-वार दवा चार्ट के अनुसार इलाज दें। P. vivax: 3 दिन क्लोरोक्वीन + 14 दिन प्राइमाक्वीन। P. falciparum: ACT (आर्टेसुनेट कॉम्बिनेशन) + प्राइमाक्वीन की एक खुराक। पूरा कोर्स करना ज़रूरी है।","tip":"गर्भवती महिलाओं और शिशुओं को प्राइमाक्वीन न दें। मलेरिया वाली गर्भवती महिला को MO के पास भेजें।"},{"title":"गंभीर मलेरिया","text":"बेहोशी, दौरे, बार-बार उल्टी, खा-पी न पाना, बहुत पीलापन, आँखें पीली, गहरे रंग का पेशाब, या बहुत कम पेशाब हो तो तुरंत रेफर करें।","tip":"गंभीर मलेरिया कुछ घंटों में जान ले सकता है।"}]},{"id":"vbd.dengue","title":"डेंगू और चिकनगुनिया","cards":[{"title":"एडीज़ मच्छर","text":"डेंगू और चिकनगुनिया एडीज़ मच्छर से फैलते हैं। इस पर सफेद धारियाँ होती हैं, यह दिन में काटता है, और साफ़ जमा पानी में पनपता है: कूलर, टंकी, टायर, बर्तन और गमले।","tip":"मच्छर के अंडों के लिए एक चम्मच पानी भी काफ़ी है।"},{"title":"लक्षण","text":"डेंगू: अचानक तेज़ बुखार, तेज़ सिरदर्द, आँखों के पीछे दर्द, बदन और जोड़ों में दर्द, दाने। चिकनगुनिया: बुखार के साथ जोड़ों में तेज़ दर्द जो हफ्तों तक रह सकता है।","tip":"डेंगू जाँच के लिए स्वास्थ्य केंद्र भेजें।"},{"title":"घर पर देखभाल","text":"खूब तरल — ORS, पानी, नारियल पानी, जूस। आराम। बुखार के लिए सिर्फ पैरासिटामोल दें। एस्पिरिन, आइबुप्रोफेन या दूसरी दर्द की दवाएँ न दें — इनसे खून बह सकता है।","tip":"बीमारी फैलने से रोकने के लिए मरीज़ को मच्छरदानी में रखें।"},{"title":"चेतावनी के लक्षण — रेफर करें","text":"पेट में तेज़ दर्द, बार-बार उल्टी, मसूड़ों या नाक से खून, काला मल, ठंडी चिपचिपी त्वचा, बेचैनी या सुस्ती। ये अक्सर बुखार उतरते समय (दिन 3 से 7) आते हैं।","tip":"बुखार उतरने का मतलब हमेशा यह नहीं कि मरीज़ सुरक्षित है।"}]},{"id":"vbd.control","title":"गाँव में मच्छर नियंत्रण","cards":[{"title":"मच्छर पनपने से रोकें","text":"हफ्ते में एक बार कूलर, टंकी और बर्तन खाली करें, रगड़ें और सुखाएँ ('ड्राई डे')। पानी के सभी बर्तन ढकें। पुराने टायर, नारियल के खोल और टूटे बर्तन फेंक दें या उल्टा रखें।","tip":"परिवारों के साथ घर-घर जाँच करें — उन्हें लार्वा दिखाएँ।"},{"title":"मच्छरदानी में सोएँ","text":"सभी, खासकर गर्भवती महिलाएँ और बच्चे, हर रात लंबे समय तक चलने वाली कीटनाशक मच्छरदानी (LLIN) में सोएँ। मच्छरदानी बार-बार न धोएँ। गद्दे के नीचे दबाएँ।","tip":"पूरी बाँह के कपड़े पहनें, और उपलब्ध हो तो मच्छर भगाने वाली क्रीम लगाएँ।"},{"title":"छिड़काव और मछली","text":"परिवारों को घर के अंदर छिड़काव (IRS) करवाने और छिड़काव के बाद दीवार पर लिपाई-पुताई न करने के लिए प्रेरित करें। लार्वा खाने वाली मछली (गम्बूज़िया, गप्पी) तालाब, कुएँ और टंकियों में डाली जा सकती है।","tip":"नए मच्छर पनपने की जगहों के बारे में ANM को बताएँ।"}]},{"id":"vbd.filaria","title":"लसीका फाइलेरिया (हाथीपाँव)","cards":[{"title":"फाइलेरिया क्या है","text":"फाइलेरिया क्यूलेक्स मच्छर से फैलता है, जो गंदे पानी में पनपता है। कृमि सालों तक शरीर को नुकसान पहुँचाता है और पैरों में सूजन (हाथीपाँव) या हाइड्रोसील करता है। ज़्यादातर संक्रमित लोगों में सालों तक कोई लक्षण नहीं होते।","tip":"इससे बचाव हो सकता है, पर सूजन पूरी तरह ठीक नहीं होती।"},{"title":"सामूहिक दवा सेवन (MDA)","text":"MDA के दौरान हर योग्य व्यक्ति स्वास्थ्य कर्मी के सामने गोलियाँ (DEC + एल्बेंडाज़ोल, या आइवरमेक्टिन के साथ — IDA) ले। 2 साल से छोटे बच्चों, गर्भवती महिलाओं और गंभीर बीमारों को नहीं दी जाती।","tip":"लोगों को कहें कि गोली खाने से पहले खाना खा लें।"},{"title":"सूजे हुए अंगों की देखभाल","text":"सूजे पैर को रोज़ साबुन-पानी से धोएँ, अच्छी तरह सुखाएँ, त्वचा साफ़ रखें, व्यायाम करें और पैर ऊँचा रखें। हाइड्रोसील मुफ्त ऑपरेशन से ठीक हो सकता है।","tip":"सूजन या हाइड्रोसील वाले मरीज़ों की लाइन लिस्ट बनाएँ।"}]},{"id":"vbd.je_ka","title":"जापानी इंसेफेलाइटिस और काला-अज़ार","cards":[{"title":"जापानी इंसेफेलाइटिस (JE / AES)","text":"JE क्यूलेक्स मच्छर से सूअरों और पक्षियों से फैलता है, धान वाले क्षेत्रों में। बुखार के साथ भ्रम, बेहोशी या दौरे वाले बच्चे को तुरंत रेफर करें। प्रभावित ज़िलों में JE टीका 9 महीने और 16-24 महीने पर दिया जाता है।","tip":"दौरे वाले बुखार में हर मिनट कीमती है।"},{"title":"काला-अज़ार","text":"काला-अज़ार बिहार, झारखंड, उत्तर प्रदेश और पश्चिम बंगाल के कुछ क्षेत्रों में बालू मक्खी से फैलता है। लक्षण: 2 हफ्ते से ज़्यादा बुखार, बढ़ी हुई तिल्ली (पेट के बाईं ओर सूजन), वज़न कम होना, त्वचा काली पड़ना।","tip":"जाँच (rK39) और इलाज मुफ्त हैं। बालू मक्खी कच्ची दीवारों की दरारों में पनपती है — उन्हें लीपें।"}]}],"quiz":[{"q":"डेंगू कौन सा मच्छर फैलाता है?","options":["एनोफिलीज़","एडीज़","क्यूलेक्स","घरेलू मक्खी"],"explain":"एडीज़, दिन में काटने वाला मच्छर जो साफ़ जमा पानी में पनपता है।"},{"q":"मलेरिया क्षेत्र में किसी को बुखार है। पहला कदम क्या है?","options":["पैरासिटामोल देकर 1 हफ्ता इंतज़ार","RDT/ब्लड स्लाइड से जाँच","एंटीबायोटिक देना","1 महीना बुखार रहे तभी रेफर"],"explain":"हर बुखार की 24 घंटे के अंदर जाँच करें।"},{"q":"डेंगू में बुखार के लिए कौन सी दवा दी जा सकती है?","options":["एस्पिरिन","आइबुप्रोफेन","पैरासिटामोल","कोई भी दर्द की दवा"],"explain":"सिर्फ पैरासिटामोल। एस्पिरिन और आइबुप्रोफेन से खून बह सकता है।"},{"q":"कूलर और पानी की टंकी कितनी बार खाली करके सुखानी चाहिए?","options":["साल में एक बार","हफ्ते में एक बार","महीने में एक बार","कभी नहीं"],"explain":"हफ्ते में एक बार — एडीज़ के अंडे लगभग 7 दिन में मच्छर बन जाते हैं।"},{"q":"फाइलेरिया की MDA गोलियाँ किसे नहीं लेनी चाहिए?","options":["स्वस्थ वयस्क","2 साल से बड़े बच्चे","गर्भवती महिलाएँ","स्वस्थ बुज़ुर्ग"],"explain":"2 साल से छोटे बच्चे, गर्भवती महिलाएँ और गंभीर बीमार लोगों को नहीं।"},{"q":"प्राइमाक्वीन किसे नहीं देनी चाहिए?","options":["वयस्क पुरुष","गर्भवती महिलाएँ","किसान","8 साल से बड़े स्कूली बच्चे"],"explain":"प्राइमाक्वीन गर्भवती महिलाओं और शिशुओं को नहीं दी जाती।"}]},{"id":"ncd","title":"गैर-संचारी रोग और व्यापक प्राथमिक स्वास्थ्य देखभाल","subtitle":"BP, डायबिटीज़, कैंसर जाँच, मानसिक स्वास्थ्य, बुज़ुर्गों की देखभाल और प्राथमिक उपचार","lessons":[{"id":"ncd.cbac","title":"जनसंख्या गणना और CBAC","cards":[{"title":"हर परिवार की सूची","text":"अपने क्षेत्र के सभी परिवारों और सदस्यों की सूची बनाएँ। 30 साल और उससे ज़्यादा उम्र के हर व्यक्ति का CBAC (समुदाय आधारित आकलन चेकलिस्ट) फ़ॉर्म भरें।","tip":"जन्म, मृत्यु, विवाह या पलायन होने पर सूची अपडेट करें।"},{"title":"CBAC स्कोर","text":"CBAC में उम्र, तंबाकू, शराब, कमर का नाप, शारीरिक गतिविधि, और परिवार में BP या डायबिटीज़ के बारे में पूछा जाता है। 4 से ज़्यादा स्कोर का मतलब ज़्यादा खतरा। इसमें टीबी, कैंसर और दूसरी बीमारियों के लक्षण भी पूछे जाते हैं।","tip":"30 से ऊपर सभी की जाँच ज़रूरी है। 4 से ज़्यादा स्कोर वाले प्राथमिकता हैं।"},{"title":"जाँच के लिए लाएँ","text":"लोगों को BP, डायबिटीज़, और मुँह, स्तन व गर्भाशय-ग्रीवा के कैंसर की जाँच के लिए आयुष्मान आरोग्य मंदिर (उप-केंद्र / PHC) पर लाएँ।","tip":"इलाज पर चल रहे सभी लोगों की फॉलो-अप सूची रखें।"}]},{"id":"ncd.htn_dm","title":"हाई BP और डायबिटीज़","cards":[{"title":"चुपचाप बढ़ने वाली बीमारियाँ","text":"हाई BP और डायबिटीज़ में शुरू में आमतौर पर कोई लक्षण नहीं होते। सालों में ये दिल, दिमाग, गुर्दे और आँखों को नुकसान पहुँचाती हैं, और हार्ट अटैक व लकवा करती हैं। सिर्फ जाँच से ही इन्हें जल्दी पकड़ा जा सकता है।","tip":"जाँच में BP 140/90 या ज़्यादा — CHO/MO के पास भेजें।"},{"title":"रोज़ दवा","text":"एक बार शुरू होने पर BP और डायबिटीज़ की दवा रोज़ लेनी होती है, आमतौर पर जीवनभर। अच्छा लगने पर बंद न करें। आयुष्मान आरोग्य मंदिर से मुफ्त दवा और हर महीने जाँच लें।","tip":"जिन मरीज़ों की दवा खत्म हो जाए, उन्हें समय पर दवा दिलाने में मदद करें।"},{"title":"स्वस्थ जीवनशैली","text":"कम नमक (दिन में 1 चम्मच से कम), कम तेल, चीनी और तला खाना। ज़्यादा सब्ज़ियाँ और फल। रोज़ 30 मिनट चलें या व्यायाम करें। तंबाकू और शराब छोड़ें। वज़न नियंत्रण में रखें।","tip":"अचार, पापड़ और नमकीन में बहुत नमक होता है।"},{"title":"आपातकालीन लक्षण","text":"चेहरे, हाथ या पैर में अचानक कमज़ोरी, बोलने में तकलीफ़ (लकवा), छाती में दर्द जो हाथ या जबड़े तक जाए, पसीना (हार्ट अटैक)। तुरंत 108 पर कॉल करें।","tip":"लकवे में पहले 4 घंटों में अस्पताल पहुँचने से जान बचती है।"}]},{"id":"ncd.cancer","title":"सामान्य कैंसर: मुँह, स्तन, गर्भाशय-ग्रीवा","cards":[{"title":"मुँह का कैंसर","text":"तंबाकू (गुटखा, खैनी, बीड़ी, सिगरेट) और शराब से मुँह का कैंसर होता है। लक्षण: मुँह में सफेद या लाल दाग, 2 हफ्ते में न भरने वाला छाला, मुँह खोलने में तकलीफ़।","tip":"तंबाकू छोड़ने के लिए प्रेरित करें। तंबाकू छोड़ो हेल्पलाइन: 1800-11-2356।"},{"title":"स्तन कैंसर","text":"लक्षण: स्तन या बगल में गाँठ, स्तन के आकार में बदलाव, निप्पल से स्राव या खून, संतरे के छिलके जैसी त्वचा। 30 साल और उससे ज़्यादा उम्र की महिलाओं की स्तन जाँच होनी चाहिए।","tip":"बिना दर्द की गाँठ की भी जाँच ज़रूरी है।"},{"title":"गर्भाशय-ग्रीवा (सर्वाइकल) कैंसर","text":"लक्षण: माहवारी के बीच, संबंध के बाद, या माहवारी बंद होने के बाद खून आना, और बदबूदार स्राव। 30-65 साल की महिलाओं की VIA जाँच होनी चाहिए। लड़कियों को HPV टीका इससे बचाता है।","tip":"जल्दी पता चलने पर सर्वाइकल कैंसर पूरी तरह ठीक हो सकता है।"}]},{"id":"ncd.mental_elderly","title":"मानसिक स्वास्थ्य और बुज़ुर्गों की देखभाल","cards":[{"title":"मानसिक स्वास्थ्य","text":"ध्यान देने वाले लक्षण: 2 हफ्ते से ज़्यादा उदासी, नींद या भूख न लगना, किसी चीज़ में रुचि न होना, खुद से बात करना, आवाज़ें सुनना, बहुत शक करना, या दौरे (मिर्गी)। ये बीमारियाँ हैं और इनका इलाज होता है।","tip":"बिना राय बनाए सुनें। मानसिक बीमारी भूत-प्रेत या जादू-टोने से नहीं होती।"},{"title":"मदद दिलाएँ","text":"MO या ज़िला मानसिक स्वास्थ्य कार्यक्रम को रेफर करें। टेली-मानस पर मुफ्त परामर्श: 14416। अगर कोई अपनी जान लेने की बात करे, तो उसे अकेला न छोड़ें और तुरंत मदद लें।","tip":"शराब और नशे की समस्या पर भी ध्यान दें।"},{"title":"बुज़ुर्गों की देखभाल","text":"बुज़ुर्गों में कम दिखना (मोतियाबिंद), कम सुनना, गिरना, याददाश्त कम होना, और बिस्तर के घाव की जाँच करें। मुफ्त इलाज और पेंशन योजनाएँ दिलाने में मदद करें। बिस्तर पर पड़े मरीज़ों के परिवार को प्रशामक (पैलिएटिव) देखभाल सिखाएँ।","tip":"गिरने से बचाने के लिए फिसलन वाला फर्श हटाएँ और रात में अच्छी रोशनी रखें।"}]},{"id":"ncd.firstaid","title":"प्राथमिक उपचार और आपातकाल","cards":[{"title":"साँप का काटना","text":"व्यक्ति को शांत और स्थिर रखें। अंगूठी और कसी चीज़ें उतारें। काटे गए अंग को खपच्ची से स्थिर रखें। एंटी-स्नेक वेनम के लिए तुरंत अस्पताल ले जाएँ। घाव को न काटें, न चूसें, न जलाएँ, और कसकर रस्सी न बाँधें।","tip":"झाड़-फूँक वालों के पास समय बर्बाद न करें।"},{"title":"जलना","text":"जले हिस्से पर 20 मिनट साफ़ ठंडा बहता पानी डालें। गहने उतारें। साफ़ कपड़े से ढकें। टूथपेस्ट, तेल या स्याही न लगाएँ। बड़े या गहरे जलने को रेफर करें।","tip":"व्यक्ति को गर्म रखने के लिए साफ़ चादर में लपेटें।"},{"title":"खून बहना और चोट","text":"खून बहते घाव पर साफ़ कपड़े से ज़ोर से दबाएँ। चोट वाला हिस्सा ऊपर उठाएँ। सड़क दुर्घटना में गर्दन को न हिलाएँ; 108 पर कॉल करें।","tip":"आपातकालीन नंबर 108 और 102 पास रखें।"},{"title":"लू और ज़हर","text":"लू: छाँव में ले जाएँ, गीले कपड़े से ठंडा करें, होश में हो तो तरल दें, रेफर करें। ज़हर (कीटनाशक, केरोसिन): उल्टी न कराएँ, डिब्बा/बोतल अस्पताल ले जाएँ।","tip":"कीटनाशक ताले में और बच्चों से दूर रखें।"}]}],"quiz":[{"q":"CBAC फ़ॉर्म किसके लिए भरा जाता है?","options":["सभी बच्चों के लिए","30 साल और उससे ज़्यादा उम्र के सभी लोगों के लिए","सिर्फ गर्भवती महिलाओं के लिए","सिर्फ बीमार लोगों के लिए"],"explain":"CBAC 30 साल और उससे ज़्यादा उम्र के सभी लोगों का भरा जाता है।"},{"q":"BP की दवा लेने वाला व्यक्ति अब ठीक महसूस करता है। उसे क्या करना चाहिए?","options":["दवा बंद कर दे","सिर्फ सिरदर्द होने पर ले","रोज़ दवा जारी रखे","आधी खुराक ले"],"explain":"BP की दवा रोज़ जारी रखनी है; ठीक लगना मतलब दवा असर कर रही है।"},{"q":"तंबाकू खाने वाले के मुँह में 3 हफ्ते से छाला हो सकता है:","options":["सामान्य","मुँह के कैंसर का लक्षण — रेफर करें","सिर्फ मसालेदार खाने से","सिर्फ विटामिन की कमी"],"explain":"2 हफ्ते में न भरने वाले छाले की मुँह के कैंसर की जाँच होनी चाहिए।"},{"q":"टेली-मानस मानसिक स्वास्थ्य हेल्पलाइन नंबर है:","options":["108","14416","1098","102"],"explain":"टेली-मानस: 14416, मुफ्त और 24x7 उपलब्ध।"},{"q":"साँप काटने पर प्राथमिक उपचार है:","options":["घाव काटकर चूसना","कसकर रस्सी बाँधना","अंग स्थिर रखकर तुरंत अस्पताल ले जाना","झाड़-फूँक वाले के पास जाना"],"explain":"शांत रखें, अंग स्थिर करें, और एंटी-स्नेक वेनम के लिए अस्पताल पहुँचें।"},{"q":"जलने पर प्राथमिक उपचार क्या है?","options":["टूथपेस्ट लगाना","20 मिनट ठंडा बहता पानी","तेल लगाना","छाले फोड़ना"],"explain":"20 मिनट ठंडा बहता पानी, फिर साफ़ कपड़े से ढकें।"}]},{"id":"ado","title":"किशोर और महिला स्वास्थ्य","subtitle":"किशोर स्वास्थ्य (RKSK), माहवारी, एनीमिया और कम उम्र में शादी","lessons":[{"id":"ado.rksk","title":"किशोर स्वास्थ्य (RKSK)","cards":[{"title":"किशोर कौन हैं","text":"10 से 19 साल के लड़के-लड़कियाँ किशोर हैं। उनके शरीर और मन में तेज़ी से बदलाव होते हैं। उन्हें पोषण, शरीर के बदलाव, मानसिक स्वास्थ्य, और तंबाकू, शराब व नशे से दूर रहने के बारे में सही जानकारी चाहिए।","tip":"किशोरों से इज़्ज़त से और अकेले में बात करें। उन्हें डाँटें या शर्मिंदा न करें।"},{"title":"किशोर मैत्री स्वास्थ्य क्लिनिक","text":"RKSK (राष्ट्रीय किशोर स्वास्थ्य कार्यक्रम) के तहत PHC, CHC और ज़िला अस्पताल में किशोर मैत्री स्वास्थ्य क्लिनिक (AFHC) में किशोरों को मुफ़्त सलाह और इलाज मिलता है। वे जो बताते हैं, उसे गुप्त रखा जाता है।","tip":"किशोरों को पास के क्लिनिक का दिन और जगह बताएँ।"},{"title":"साथिया (साथी शिक्षक)","text":"हर गाँव में 2 लड़के और 2 लड़कियाँ साथिया चुने जाते हैं, जो दूसरे किशोरों को स्वास्थ्य संदेश देते हैं। अपने गाँव में किशोर स्वास्थ्य और कल्याण दिवस आयोजित करने में उनकी मदद करें।","tip":"किशोर बड़ों से ज़्यादा दोस्तों की बात सुनते हैं।"}]},{"id":"ado.mhm","title":"माहवारी और माहवारी स्वच्छता","cards":[{"title":"माहवारी सामान्य है","text":"माहवारी आमतौर पर 10 से 15 साल की उम्र में शुरू होती है। सामान्य चक्र हर 21 से 35 दिन में आता है और 2 से 7 दिन चलता है। यह शरीर की सामान्य, स्वस्थ प्रक्रिया है — बीमारी या गंदी बात नहीं।","tip":"माहवारी शुरू होने से पहले ही लड़कियों से बात करें, ताकि वे डरें नहीं।"},{"title":"साफ़ रहें","text":"साफ़ सैनिटरी पैड या साफ़ सूती कपड़ा इस्तेमाल करें। हर 4 से 6 घंटे में बदलें। दोबारा इस्तेमाल होने वाला कपड़ा साबुन से धोकर धूप में सुखाएँ। इस्तेमाल किया पैड कागज़ में लपेटकर कूड़ेदान में डालें, या जलाएँ या गाड़ दें। बदलने से पहले और बाद में हाथ धोएँ।","tip":"धूप में सुखाने से कीटाणु मर जाते हैं। कपड़े को अंधेरी, गीली जगह छिपाकर न सुखाएँ।"},{"title":"गलत धारणाएँ दूर करें","text":"माहवारी के दौरान लड़की नहा सकती है, स्कूल जा सकती है, खेल सकती है, खाना बना सकती है और खट्टा समेत सब सामान्य खाना खा सकती है। उसे परिवार से अलग रखने की ज़रूरत नहीं है।","tip":"माताओं से भी बात करें — घर के कई नियम वही तय करती हैं।"},{"title":"कब रेफ़र करें","text":"डॉक्टर के पास भेजें अगर: बहुत ज़्यादा खून आए (1 से 2 घंटे में पैड भीग जाए), 7 दिन से ज़्यादा खून आए, बहुत तेज़ दर्द हो, 3 महीने से माहवारी न आए (और गर्भ न हो), या 15 साल तक माहवारी शुरू ही न हो।","tip":"ज़्यादा माहवारी से एनीमिया हो सकता है। उसका Hb जाँचें।"}]},{"id":"ado.anaemia","title":"एनीमिया मुक्त भारत","cards":[{"title":"एनीमिया क्या है","text":"एनीमिया का मतलब है खून में हीमोग्लोबिन (Hb) कम होना। लक्षण: थकान, कमज़ोरी, साँस फूलना, चक्कर, और आँखें, जीभ व नाखून पीले। इससे बच्चे की पढ़ने की क्षमता घटती है और गर्भावस्था में माँ का ख़तरा बढ़ता है।","tip":"किशोरियों और गैर-गर्भवती महिलाओं में Hb 12 g/dl से कम एनीमिया है; गर्भवती में 11 g/dl से कम।"},{"title":"साप्ताहिक आयरन गोली (WIFS)","text":"10 से 19 साल के किशोर: पूरे साल हर हफ़्ते 1 नीली IFA गोली — स्कूल में, या स्कूल न जाने वाले किशोरों को आँगनवाड़ी में आपके द्वारा। प्रजनन उम्र की महिलाएँ (गर्भवती या स्तनपान कराने वाली नहीं): हर हफ़्ते 1 लाल IFA गोली। साल में दो बार एल्बेंडाज़ोल से कृमि मुक्ति (राष्ट्रीय कृमि मुक्ति दिवस)।","tip":"पेट की तकलीफ़ कम करने के लिए आयरन गोली खाने के बाद लें। काला मल सामान्य है।"},{"title":"आयरन वाला खाना","text":"हरी पत्तेदार सब्ज़ियाँ, दालें, अंकुरित अनाज, गुड़, खजूर, अंडे, मांस या मछली खाएँ। खाने के साथ आँवला, अमरूद या नींबू जैसे विटामिन C वाले फल लें — इससे शरीर आयरन ज़्यादा लेता है। खाने के 1 घंटे के अंदर चाय या कॉफ़ी न पिएँ।","tip":"लोहे की कढ़ाई में खाना बनाने से खाने में आयरन बढ़ता है।"},{"title":"जाँच, इलाज, बातचीत (T3)","text":"लोगों को T3 कैंप और स्वास्थ्य केंद्र पर Hb जाँच कराने में मदद करें। एनीमिया वाले लोगों को इलाज की ख़ुराक में आयरन दिया जाता है। गंभीर एनीमिया (Hb 7 g/dl से कम) हो तो अस्पताल रेफ़र करना ज़रूरी है।","tip":"एनीमिया वाली लड़कियों और महिलाओं की सूची रखें और हर महीने फ़ॉलो-अप करें।"}]},{"id":"ado.marriage","title":"शादी और गर्भ के लिए सही उम्र","cards":[{"title":"शादी की क़ानूनी उम्र","text":"क़ानून के अनुसार शादी के लिए लड़की की उम्र कम से कम 18 साल और लड़के की कम से कम 21 साल होनी चाहिए। कम उम्र में शादी से लड़की के स्वास्थ्य और पढ़ाई को नुकसान होता है।","tip":"बाल विवाह की ख़बर मिले तो ANM, आँगनवाड़ी कार्यकर्ता को बताएँ या चाइल्डलाइन 1098 पर कॉल करें।"},{"title":"पहला गर्भ 20 साल के बाद","text":"20 साल से पहले गर्भ ख़तरनाक है: ज़्यादा एनीमिया, हाई BP, मुश्किल प्रसव, और कम वज़न का बच्चा। नवविवाहित जोड़े कंडोम या गोलियों से पहला गर्भ टाल सकते हैं।","tip":"नवविवाहित जोड़ों को नई पहल किट दें और तरीक़े समझाएँ।"},{"title":"किशोरों का मानसिक स्वास्थ्य","text":"जो किशोर उदास रहें, स्कूल जाना छोड़ दें, खाना छोड़ दें, बार-बार झगड़ें, या तंबाकू, शराब या नशा शुरू करें, उन पर ध्यान दें। बिना राय बनाए सुनें और AFHC काउंसलर या टेली-मानस 14416 से जोड़ें।","tip":"परीक्षा का तनाव और परिवार की समस्याएँ आम हैं। प्यार भरा शब्द मदद करता है।"}]}],"quiz":[{"q":"किशोर किस उम्र के होते हैं?","options":["5 से 9 साल","10 से 19 साल","20 से 24 साल","सिर्फ 13 से 15 साल"],"explain":"किशोर 10 से 19 साल के होते हैं।"},{"q":"सैनिटरी पैड या कपड़ा कितनी देर में बदलना चाहिए?","options":["दिन में एक बार","हर 4 से 6 घंटे में","पूरा भीगने पर ही","हर 2 दिन में"],"explain":"साफ़ रहने और संक्रमण से बचने के लिए हर 4 से 6 घंटे में बदलें।"},{"q":"WIFS के तहत किशोर को नीली IFA गोली कितनी बार लेनी है?","options":["रोज़","हफ़्ते में एक बार","महीने में एक बार","सिर्फ बीमार होने पर"],"explain":"पूरे साल हर हफ़्ते एक नीली IFA गोली।"},{"q":"कौन सा पेय खाने के साथ नहीं लेना चाहिए, क्योंकि यह आयरन का अवशोषण घटाता है?","options":["नींबू पानी","चाय","पानी","छाछ"],"explain":"चाय और कॉफ़ी आयरन का अवशोषण घटाती हैं। खाने के 1 घंटे आसपास न लें।"},{"q":"भारत में लड़की की शादी की न्यूनतम क़ानूनी उम्र क्या है?","options":["16 साल","18 साल","21 साल","14 साल"],"explain":"लड़की: 18 साल। लड़का: 21 साल।"},{"q":"15 साल की लड़की कहती है कि माहवारी में हर घंटे पैड भीग जाता है। आप:","options":["कहेंगी कि यह सामान्य है","डॉक्टर के पास भेजेंगी और Hb जाँच कराएँगी","कम खाने को कहेंगी","6 महीने इंतज़ार करेंगी"],"explain":"बहुत ज़्यादा खून आने पर डॉक्टर की ज़रूरत है और इससे एनीमिया हो सकता है।"}]},{"id":"role","title":"आशा की भूमिका, रिकॉर्ड और संवाद","subtitle":"आपके कर्तव्य, गाँव की बैठकें, रजिस्टर, गृह भ्रमण और परामर्श","lessons":[{"id":"role.duties","title":"आशा कौन है","cards":[{"title":"लोगों और स्वास्थ्य व्यवस्था के बीच की कड़ी","text":"ASHA का मतलब है मान्यता प्राप्त सामाजिक स्वास्थ्य कार्यकर्ता (Accredited Social Health Activist)। आप गाँव की ही महिला हैं, जिसे गाँव ने चुना है — आमतौर पर लगभग 1000 लोगों पर एक आशा। आप परिवारों को स्वास्थ्य सेवाओं से जोड़ती हैं।","tip":"स्वास्थ्य की मदद के लिए परिवार सबसे पहले आपके पास आते हैं। उनका भरोसा आपकी ताक़त है।"},{"title":"आपकी तीन भूमिकाएँ","text":"1. सुविधा देने वाली — आप लोगों को ANC, टीकाकरण, प्रसव और जाँच जैसी सेवाओं तक लाती हैं। 2. सेवा देने वाली — आप प्राथमिक उपचार, ORS, ज़िंक, IFA, गर्भनिरोधक, गर्भ जाँच किट और मलेरिया जाँच देती हैं। 3. जागरूकता लाने वाली — आप गाँव को उसके स्वास्थ्य अधिकारों के बारे में जागरूक करती हैं।","tip":"कौन सी सेवाएँ मुफ़्त हैं, यह परिवारों को हमेशा बताएँ।"},{"title":"आपकी दवा किट","text":"आपकी किट में: ORS, ज़िंक, पैरासिटामोल, IFA गोली, एल्बेंडाज़ोल, कंडोम, गर्भनिरोधक गोलियाँ, गर्भ जाँच किट, रूई, पट्टी, एंटीसेप्टिक, और ज़रूरत हो वहाँ मलेरिया RDT और दवाएँ होती हैं। एक्सपायरी तारीख़ जाँचें और PHC की मासिक बैठक में किट फिर से भरवाएँ।","tip":"किट साफ़, सूखी और बच्चों से दूर रखें।"}]},{"id":"role.meetings","title":"VHSNC, VHSND और बैठकें","cards":[{"title":"ग्राम स्वास्थ्य, स्वच्छता और पोषण समिति","text":"VHSNC गाँव के स्वास्थ्य, पानी, स्वच्छता और पोषण के काम की योजना बनाती है। इसकी बैठक हर महीने होती है। आशा इसकी सदस्य-सचिव या संयोजक है। समिति के पास अनटाइड फ़ंड होता है, जो गाँव की ज़रूरतों के लिए इस्तेमाल हो सकता है — जैसे सफ़ाई अभियान या ग़रीब परिवार को आपात मदद।","tip":"हर बैठक की कार्यवाही लिखें और फ़ंड कैसे ख़र्च हुआ इसका हिसाब रखें।"},{"title":"VHSND — ग्राम स्वास्थ्य दिवस","text":"ग्राम स्वास्थ्य, स्वच्छता और पोषण दिवस हर महीने आँगनवाड़ी में ANM और आँगनवाड़ी कार्यकर्ता के साथ होता है। सेवाएँ: ANC जाँच, टीकाकरण, बच्चों का वज़न, पोषण सलाह, परिवार नियोजन और NCD जाँच।","tip":"ड्यू लिस्ट साथ रखें। एक दिन पहले घर जाकर परिवारों को याद दिलाएँ।"},{"title":"PHC में मासिक बैठक","text":"PHC या स्वास्थ्य केंद्र पर आशा की मासिक बैठक में शामिल हों। यहाँ आप अपना काम बताती हैं, नया सीखती हैं, समस्याएँ सुलझाती हैं, दवा किट भरवाती हैं और प्रोत्साहन राशि के दावे जमा करती हैं।","tip":"महीने भर अपने सवाल लिखती रहें और बैठक में पूछें।"}]},{"id":"role.records","title":"रिकॉर्ड और प्रोत्साहन राशि","cards":[{"title":"आपके रजिस्टर","text":"अपनी आशा डायरी या रजिस्टर अपडेट रखें: परिवारों की सूची, योग्य दंपति, गर्भवती महिलाएँ, जन्म और मृत्यु, टीकाकरण ड्यू लिस्ट, 5 साल से छोटे बच्चे, बुख़ार और टीबी के केस, और CBAC के साथ 30+ उम्र के लोग।","tip":"उसी दिन लिखें। याददाश्त भूलती है, रिकॉर्ड नहीं।"},{"title":"सही रिकॉर्ड जान बचाता है","text":"आपके रिकॉर्ड से ANM और डॉक्टर को पता चलता है कि किसे देखभाल चाहिए। सही आँकड़ों से टीके, दवा और कैंप की योजना बनती है। जो हुआ ही न हो, वह कभी न लिखें।","tip":"हर महीने ANM और आँगनवाड़ी कार्यकर्ता के साथ अपनी सूची मिलाएँ।"},{"title":"प्रोत्साहन राशि","text":"नियमित काम के लिए आपको हर महीने तय राशि मिलती है और ख़ास कामों के लिए अतिरिक्त प्रोत्साहन राशि मिलती है — जैसे संस्थागत प्रसव, पूर्ण टीकाकरण, टीबी इलाज सहायता और परिवार नियोजन। भुगतान सीधे आपके बैंक खाते में आता है।","tip":"अपने दावा फ़ॉर्म की कॉपी रखें। भुगतान देर से आए तो आशा फ़ैसिलिटेटर से पूछें।"}]},{"id":"role.ipc","title":"गृह भ्रमण और परामर्श","cards":[{"title":"पहले कौन से घर","text":"इन घरों में पहले जाएँ: गर्भवती महिलाएँ, नवजात और प्रसव के बाद की माँ, 2 साल स cards":[{"title":"मोतियाबिंद","text":"मोतियाबिंद से धुंधला दिखता है, ज़्यादातर बुज़ुर्गों में। आँख की काली पुतली सफ़ेद या भूरी दिख सकती है। राष्ट्रीय अंधता और दृष्टि दोष नियंत्रण कार्यक्रम के तहत सरकारी अस्पताल में मोतियाबिंद का ऑपरेशन मुफ़्त है।","tip":"जिन बुज़ुर्गों को ठीक से नहीं दिखता, उनकी सूची बनाएँ और आँख कैंप तक पहुँचने में मदद करें।"},{"title":"बच्चों की आँखें","text":"जो बच्चा किताब बहुत पास रखे, आँखें सिकोड़े, TV के पास बैठे, या आँखों से पानी और सिरदर्द रहे, उसे चश्मे की ज़रूरत हो सकती है। आँख जाँच के लिए रेफ़र करें। बच्चे की पुतली में सफ़ेद धब्बा या भेंगापन हो तो भी रेफ़र करें।","tip":"स्कूल नेत्र कार्यक्रम के तहत स्कूली बच्चों को चश्मा मुफ़्त मिलता है।"},{"title":"आँख की चोट और लाल आँख","text":"आँख में कुछ गिरे तो बहुत सारे साफ़ पानी से धोएँ। रगड़ें नहीं। आँख में काजल, तेल, दूध या कोई घरेलू नुस्ख़ा न डालें। आँख की चोट, दर्द वाली लाल आँख, या अचानक दिखना बंद हो तो तुरंत रेफ़र करें।","tip":"डायबिटीज़ वाले लोगों को हर साल आँख की जाँच करानी चाहिए।"}]},{"id":"eeo.ent","title":"कान और सुनने की देखभाल","cards":[{"title":"बच्चों में सुनना","text":"जन्म से ही बच्चे को तेज़ आवाज़ से चौंकना चाहिए और लगभग 6 महीने तक आवाज़ की ओर मुड़ना चाहिए। ऐसा न हो तो सुनने की जाँच के लिए रेफ़र करें। जल्दी मदद से बच्चा बोलना सीख सकता है।","tip":"RBSK के तहत नवजात के सुनने की जाँच होती है।"},{"title":"कान से मवाद","text":"कान से मवाद या पानी निकले तो डॉक्टर की ज़रूरत है। कान में तेल, गर्म पानी या कोई तरल न डालें। कान सूखा रखें। तीली, पिन या माचिस की तीली से कान साफ़ न करें।","tip":"बिना इलाज के कान का मवाद बहरापन ला सकता है।"},{"title":"बड़ों में बहरापन","text":"जो बुज़ुर्ग ज़ोर से बोलें, बात बार-बार पूछें, या TV बहुत तेज़ चलाएँ, उन्हें कम सुनाई दे सकता है। जाँच के लिए रेफ़र करें; सुनने की मशीन से मदद मिल सकती है। कानों को बहुत तेज़ शोर से बचाएँ।","tip":"व्यक्ति के सामने देखकर साफ़ बोलें — चिल्लाएँ नहीं।"}]},{"id":"eeo.oral","title":"मुँह का स्वास्थ्य","cards":[{"title":"स्वस्थ दाँत","text":"दिन में दो बार — सुबह और सोने से पहले — फ़्लोराइड वाले टूथपेस्ट से ब्रश करें। खाने के बाद वारों की मदद करें।"},{"title":"हाथ धोने के कदम","text":"हाथ गीले करें, साबुन लगाएँ, हथेलियाँ, हाथ का पिछला हिस्सा, उँगलियों के बीच, उँगलियों के पीछे, अँगूठे और उँगलियों के सिरे, फिर कलाइयाँ रगड़ें। पानी से धोकर साफ़ कपड़े से पोंछें। लगभग 40 सेकंड लगने चाहिए।","tip":"खाने से पहले, खाना बनाने से पहले, बच्चे को खिलाने से पहले और शौच के बाद हाथ धोएँ।"},{"title":"साफ़ आसपास","text":"घर के पास पानी जमा न होने दें — उसमें मच्छर पनपते हैं। कूड़ा गड्ढे या कूड़ेदान में डालें, गीला और सूखा कूड़ा अलग रखें, और पशुओं का बाड़ा रसोई से दूर रखें।","tip":"VHSNC के साथ गाँव सफ़ाई दिवस की योजना बनाएँ।"}]},{"id":"life.tobacco","title":"तंबाकू और शराब","cards":[{"title":"तंबाकू का नुकसान","text":"हर तरह का तंबाकू — बीड़ी, सिगरेट, गुटखा, मावा, खैनी, नसवार — कैंसर, दिल का दौरा, लकवा, टीबी और फेफड़ों की बीमारी करता है। चबाने वाला तंबाकू भी सुरक्षित नहीं है। धुआँ घर के बच्चों और गर्भवती महिलाओं को भी नुकसान करता है।","tip":"तंबाकू छोड़ो हेल्पलाइन: 1800-11-2356 (मुफ़्त)।"},{"title":"छोड़ने में मदद — 5 A","text":"हर वयस्क से तंबाकू के बारे में पूछें (Ask)। साफ़ शब्दों में छोड़ने की सलाह दें (Advise)। वह तैयार है या नहीं, जानें (Assess)। छोड़ने की तारीख़ तय करने और तलब संभालने में मदद करें (Assist)। फ़ॉलो-अप तय करें और तंबाकू मुक्ति केंद्र रेफ़र करें (Arrange)।","tip":"ज़्यादातर लोगों को छोड़ने के लिए कई बार कोशिश करनी पड़ती है। हौसला बढ़ाती रहें।"},{"title":"तंबाकू क़ानून और शराब","text":"क़ानून (COTPA) के अनुसार सार्वजनिक जगह पर धूम्रपान पर रोक है और 18 साल से छोटे लोगों को या स्कूल से 100 गज़ के अंदर तंबाकू नहीं बेचा जा सकता। शराब लिवर, दिल और पारिवारिक जीवन को नुकसान करती है, और दुर्घटना व हिंसा लाती है। शराब छोड़ना चाहने वालों को MO के पास भेजें।","tip":"टेली-मानस 14416 भी नशे में मदद कर सकता है।"}]},{"id":"life.active","title":"शारीरिक गतिविधि और सही वज़न","cards":[{"title":"रोज़ चलें-फिरें","text":"वयस्कों को हफ़्ते में कम से कम 5 दिन, रोज़ कम से कम 30 मिनट तेज़ चलना, साइकिल, योग या कोई और गतिविधि करनी चाहिए। बच्चों को रोज़ कम से कम 1 घंटा दौड़-भाग वाला खेल खेलना चाहिए।","tip":"समूह में <script>
/* ASHA Shiksha – offline illustrations (pure SVG, no image files) */
const ART = (function(){
"use strict";
const K = {ink:"#4A2E2A", skin:"#C27C52", skinD:"#9E5F3A", skinL:"#DDA27A", nail:"#F1CDB6",
  hair:"#2B1B14", sari:"#D23C77", sariD:"#A82A5C", gold:"#F2B632", blouse:"#6B3FA0",
  water:"#4FA8E0", waterL:"#CDE9FA", waterD:"#2D7FB8", paper:"#FFF8EF", ground:"#EBDCBE", groundD:"#D9C49C",
  grass:"#A6CF73", grassD:"#7FB050", wall:"#F4E4C8", wallD:"#E3CDA6", roof:"#C65A3E", roofD:"#A3452D",
  green:"#2E9D4A", greenL:"#DDF2E1", red:"#D93636", redL:"#FBE0E0", yellow:"#F2C230", yellowL:"#FFF3C4",
  grey:"#AEB7C1", greyL:"#E6EAEE", greyD:"#6B7682", white:"#FFFFFF", wood:"#9C6B3F", woodD:"#7A522E",
  baby:"#D49A72", babyD:"#B57B55", cloth:"#F6D365", clothD:"#E0B53E", blue:"#2F6FD6", blueL:"#D7E5FB",
  orange:"#EE8A2E", teal:"#1E9C96", plum:"#7B2D5E", foam:"#FFFFFF"};

const svg = (inner, o) => {
  o = o || {};
  const w = o.w || 320, h = o.h || 240;
  return `<svg class="art ${o.cls||""}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" ${o.label?`role="img" aria-label="${o.label}"`:'aria-hidden="true"'} focusable="false">${o.bg===false?"":`<rect width="${w}" height="${h}" fill="${o.bg||K.paper}"/>`}${inner}</svg>`;
};
/* position wrapper: outer group carries the placement, inner group may carry a CSS animation */
const at = (x, y, inner, o) => {
  o = o || {};
  const tf = `translate(${x} ${y})${o.r?` rotate(${o.r})`:""}${o.s||o.fx?` scale(${(o.fx?-1:1)*(o.s||1)} ${o.s||1})`:""}`;
  return `<g transform="${tf}">${o.cls?`<g class="${o.cls}"${o.style?` style="${o.style}"`:""}>${inner}</g>`:inner}</g>`;
};
/* draw shapes twice: fat dark outline underneath, flat fill on top -> one clean silhouette */
const sil = (shapes, fill, ow) => `<g fill="${K.ink}" stroke="${K.ink}" stroke-width="${ow||4.5}" stroke-linejoin="round">${shapes}</g><g fill="${fill}">${shapes}</g>`;

/* ---------- hand, pointing up, palm centre at 0,0 ---------- */
function handShapes(o){
  o = o || {};
  const fist = o.fist;
  const f = fist
    ? `<rect x="-20" y="-24" width="40" height="22" rx="9"/>`
    : `<rect x="-20" y="-46" width="10" height="42" rx="5"/><rect x="-9.6" y="-53" width="10" height="49" rx="5"/><rect x="0.8" y="-49" width="10" height="45" rx="5"/><rect x="11" y="-38" width="9.4" height="34" rx="4.7"/>`;
  return `${o.arm===false?"":`<rect x="-15" y="22" width="30" height="${o.armLen||64}" rx="7"/>`}
    <rect x="-20" y="-14" width="40" height="44" rx="14"/>${f}
    ${o.noThumb?"":`<rect x="-5.5" y="-34" width="11" height="34" rx="5.5" transform="translate(-16 16) rotate(${o.thumb==null?-38:o.thumb})"/>`}`;
}
function hand(o){
  o = o || {};
  const sk = o.skin || K.skin;
  let det = "";
  if (!o.fist) {
    det += `<g stroke="${K.skinD}" stroke-width="1.3" stroke-linecap="round" fill="none"><path d="M-9.8 -36V-10M0.6 -40V-10M10.9 -32V-10"/></g>`;
    if (o.side === "back") det += `<g fill="${K.nail}"><rect x="-18" y="-44" width="6" height="7" rx="2.5"/><rect x="-7.6" y="-51" width="6" height="7" rx="2.5"/><rect x="2.8" y="-47" width="6" height="7" rx="2.5"/><rect x="12.7" y="-36" width="6" height="7" rx="2.5"/></g>`;
    else det += `<path d="M-13 2q12 7 27 -3M-10 13q9 4 19 0" stroke="${K.skinD}" stroke-width="1.3" fill="none" stroke-linecap="round"/>`;
  } else {
    det += `<g stroke="${K.skinD}" stroke-width="1.3" stroke-linecap="round" fill="none"><path d="M-10 -22v12M0 -23v13M10 -22v12"/></g>`;
  }
  if (o.sleeve) det += `<rect x="-16" y="${22+(o.armLen||64)-18}" width="32" height="20" rx="4" fill="${o.sleeve}" stroke="${K.ink}" stroke-width="2"/>`;
  return sil(handShapes(o), sk) + det;
}

/* ---------- small things ---------- */
const bubbles = (pts, cls) => `<g class="${cls||"a-pulse"}" fill="${K.foam}" stroke="${K.waterD}" stroke-width="1.2" opacity=".95">${pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="${p[2]||5}"/>`).join("")}</g>`;
const arrow2 = (x1,y1,x2,y2,c) => `<g stroke="${c||K.blue}" stroke-width="3.5" stroke-linecap="round" fill="none"><path d="M${x1} ${y1}L${x2} ${y2}"/>${head(x2,y2,x1,y1,c)}${head(x1,y1,x2,y2,c)}</g>`;
const arrow = (x1,y1,x2,y2,c,w) => `<g stroke="${c||K.blue}" stroke-width="${w||3.5}" stroke-linecap="round" fill="none"><path d="M${x1} ${y1}L${x2} ${y2}"/>${head(x2,y2,x1,y1,c,w)}</g>`;
function head(x,y,fx,fy,c,w){ const a = Math.atan2(y-fy, x-fx), l = 9; const p = s => [x - l*Math.cos(a+s), y - l*Math.sin(a+s)];

     ${sil(`<rect x="106" y="70" width="22" height="10" rx="4"/><rect x="122" y="66" width="8" height="18" rx="3"/>`, K.greyD, 3)}
     <g class="a-dropfall"><ellipse cx="126" cy="90" rx="2.6" ry="3.6" fill="${K.water}"/></g>
     ${sil(`<path d="M8 104H34L32 84H10Z"/>`, "#fff", 3)}`
  : `<rect y="104" width="160" height="16" fill="${K.ground}"/>${sil(`<path d="M36 44H124L116 104H44Z"/>`, K.blue, 4)}<ellipse cx="80" cy="46" rx="42" ry="8" fill="${K.water}"/>

     <g fill="#7A5230"><circle cx="70" cy="46" r="2.4"/><circle cx="60" cy="48" r="2"/><circle cx="100" cy="44" r="2"/></g>
     <g class="a-bob" stroke="${K.ink}" stroke-width="2" fill="none"><path d="M120 22l6 -6M128 28l8 -2M116 14l2 -8"/></g>`, {w:160, h:120});

/* ---------- newborn kept warm / not warm ---------- */
P.warm = (good) => svg(good
  ? `<rect y="104" width="160" height="16" fill="${K.ground}"/>
     ${sil(`<ellipse cx="80" cy="74" rx="44" ry="30"/>`, K.cloth, 4)}<path d="M40 66Q80 86 120 66" stroke="${K.clothD}" stroke-width="3" fill="none"/>

     <g transform="translate(80 48) scale(.85)">${face({closed:true, blush:true})}</g>${A.sparkle(132, 30, .8)}`
  : `<rect y="96" width="160" height="24" fill="${K.greyL}"/>
     ${at(80, 70, A.babyTop({nappy:false, navel:true}), {r:90, s:.62})}
     <g class="a-dropfall" fill="${K.water}"><ellipse cx="50" cy="40" rx="3" ry="4"/><ellipse cx="110" cy="36" rx="3" ry="4"/></g>
     <g stroke="${K.blue}" stroke-width="3" fill="none" stroke-linecap="round" class="a-bob"><path d="M126 30q8 4 0 8q-8 4 0 8M140 26q8 4 0 8q-8 4 0 8"/></g>`, {w:160, h:120});

/* ---------- IFA strip ---------- */
P.ifa = (col) => {
  const c = {pink:"#F28DB2", blue:"#3E7FD9", red:"#C9302C"}[col];
  return svg(`<rect width="160" height="100" fill="${K.paper}"/>${A.strip(80, 50, 10, c, {s:1.25})}`, {w:160, h:100});
};

/* ---------- RDT result ---------- */
P.rdt = (lines) => svg(`${A.cassette(160, 60, {s:1.6, blood:true, lines})}`, {h:120});
})(ART);

      "Also give zinc once a day for 14 days, even if the diarrhoea stops: half a tablet for babies 2–6 months, one tablet for children 6 months to 5 years. Dissolve it in breast milk or clean water.",

      "Breastfeed often – at least every 2 hours. The baby can feed while in KMC.",
      "Give KMC for as many hours as possible, day and night, for at least 1 hour each time. The father, grandmother or another family member can also give KMC.",

    v_muac: {title:"Measuring MUAC", sub:"Finding severe malnutrition with the coloured tape", caps:[

  items: {
    v_hw: {title:"હાથ ધોવા: સુમન કે (SUMAN K)", sub:"સાબુથી હાથ ધોવાનાં 6 પગલાં", caps:[
      "સ્વચ્છ વહેતા પાણીથી હાથ ભીના કરો અને સાબુ લો. રસોઈ પહેલાં, બાળકને ખવડાવતાં પહેલાં, શૌચાલય પછી અને બાળકનું શૌચ સાફ કર્યા પછી હાથ ધુઓ.",

    v_ors: {title:"ઘરે ORS બનાવવું", sub:"ઝાડાવાળા બાળક માટે ORS અને ઝિંક", caps:[
      "પહેલાં સાબુ અને પાણીથી હાથ ધુઓ.",
      "સ્વચ્છ વાસણમાં 1 લિટર સ્વચ્છ પીવાનું પાણી લો – એટલે લગભગ 5 ગ્લાસ. ઉકાળીને ઠંડું કરેલું પાણી સૌથી સારું.",
      "આખું ORS પેકેટ 1 લિટર પાણીમાં નાખો. ખાંડ કે મીઠું ન ઉમેરો, અને પાણી ઓછું ન લો.",

      "કપ અને ચમચીથી થોડું થોડું વારંવાર પીવડાવો. દરેક પાતળા ઝાડા પછી 2 વર્ષથી નાના બાળકને ¼ થી ½ ગ્લાસ અને મોટા બાળકને ½ થી 1 ગ્લાસ આપો. ઊલટી થાય તો 10 મિનિટ રાહ જોઈ ફરી ધીમે ધીમે આપો. સ્તનપાન અને ખોરાક ચાલુ રાખો.",
      "ORS 24 કલાકમાં વાપરી નાખો. પછી ફેંકી દો અને નવું ORS બનાવો.",
      "સાથે 14 દિવસ રોજ એક વાર ઝિંક આપો, ઝાડા બંધ થાય તો પણ: 2–6 મહિનાના બાળકને અડધી ગોળી, 6 મહિનાથી 5 વર્ષના બાળકને એક ગોળી. તેને માતાના દૂધ કે સ્વચ્છ પાણીમાં ઓગાળો.",
      "ઝાડામાં લોહી આવે, બાળક પી ન શકે, ખૂબ ઊંઘરેટું હોય, આંખો ઊંડી હોય, વારંવાર ઊલટી થાય, કે 2 દિવસમાં સારું ન થાય – તો તરત આરોગ્ય કેન્દ્ર લઈ જાઓ."]},
    v_kmc: {title:"કાંગારૂ મધર કેર (KMC)", sub:"ત્વચાથી ત્વચાના સંપર્કથી નાનાં બાળકોને ગરમ રાખવાં", caps:[

      "વારંવાર સ્તનપાન કરાવો – ઓછામાં ઓછું દર 2 કલાકે. KMCમાં રહીને પણ બાળક ધાવી શકે છે.",
      "દિવસ-રાત બને તેટલા કલાક KMC આપો, દરેક વખતે ઓછામાં ઓછો 1 કલાક. પિતા, દાદી કે કુટુંબના બીજા સભ્ય પણ KMC આપી શકે છે.",

    v_rdt: {title:"RDTથી મેલેરિયાની તપાસ", sub:"તાવના દર્દીની રેપિડ ટેસ્ટ કિટથી તપાસ", caps:[

    v_muac: {title:"MUAC માપવું", sub:"રંગીન પટ્ટીથી ગંભીર કુપોષણ શોધવું", caps:[

  sgModule:"कौन-सा मॉड्यूल? (वैकल्पिक)", sgNone:"किसी एक मॉड्यूल के बारे में नहीं", sgMsg:"आपका सुझाव", sgPlaceholder:"यहाँ किसी भी भाषा में लिखें…",
  sgNeed:"पहले अपना सुझाव लिखें।", sgAddMe:"मेरा नाम और गाँव जोड़ें",
  sgSend:"ईमेल खोलें और भेजें", sgOpened:"आपका ईमेल ऐप खुल रहा है। संदेश देखकर Send दबाएँ।",
  sgFallback:"अगर ईमेल ऐप नहीं खुला, तो यह संदेश कॉपी करके इस पते पर भेजें",
  sgPrivacy:"संदेश आपके अपने ईमेल ऐप से जाता है। हम आपकी प्रगति या संदेश कभी इकट्ठा नहीं करते।",
  sgModuleLink:"इस मॉड्यूल में बदलाव सुझाएँ",
  storageNote:"आपकी प्रगति सिर्फ़ इसी फ़ोन में सेव होती है।"
}
};
for (const c in SUGGEST_I18N) I18N[c] = Object.assign(I18N[c] || {}, SUGGEST_I18N[c]);
</script>
<script>
(function(){
"use strict";
const PASS = 80, KEY = "asha-shiksha-web-v1";
const $app = document.getElementById("app");
const $toast = document.getElementById("toast");
const LANG_BY = Object.fromEntries(LANGS.map(l => [l.code, l]));

let S = {lang:null, name:"", village:"", ashaId:"", done:[], best:{}, certs:{}, scale:1, hideInstall:false, media:{}, mvoice:true};
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }


const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (a,b) => b ? Math.round(a*100/b) : 0;

/* ---------- language, strings, content ---------- */
function chain(code){ const l = LANG_BY[code] || LANG_BY.en; return [...new Set([l.code, ...(l.fb||[]), "en"])]; }
let STR = {}, C = null;
function loadLang(){
  const ch = chain(S.lang || "en");
  STR = {};
  [...ch].reverse().forEach(c => Object.assign(STR, I18N[c] || {}));
  C = buildContent(ch);
}
function t(k, a){
  let s = (STR[k] != null) ? STR[k] : k;
  if (a) Object.keys(a).forEach(x => { s = s.split("{"+x+"}").join(String(a[x])); });
  return s;
}
function pick(k, b, x){ return (x && typeof x[k] === "string" && x[k].trim()) ? x[k] : ((b && b[k]) || ""); }
function buildContent(ch){
  const code = ch.find(c => c !== "en" && CONTENT[c]) || "en";
  const base = CONTENT.en, tr = code === "en" ? null : CONTENT[code];
  const tm = {}; if (tr) tr.modules.forEach(m => { tm[m.id] = m; });
  const modules = base.modules.map(b => {
    const x = tm[b.id]; const tl = {};
    ((x && x.lessons) || []).forEach(l => { tl[l.id] = l; });
    return {
      id:b.id, icon:b.icon, color:b.color, lang: x ? code : "en",
      title:pick("title",b,x), subtitle:pick("subtitle",b,x),
      lessons: b.lessons.map(bl => {
        const xl = tl[bl.id];
        return { id:bl.id, icon:bl.icon, title:pick("title",bl,xl),
          cards: bl.cards.map((bc,i) => { const xc = xl && xl.cards ? xl.cards[i] : null;
            return { icon:bc.icon, title:pick("title",bc,xc), text:pick("text",bc,xc), tip:pick("tip",bc,xc) }; }) };
      }),
      quiz: b.quiz.map((bq,i) => {
        const xq = x && x.quiz ? x.quiz[i] : null;
        const opts = (xq && Array.isArray(xq.options) && xq.options.length === bq.options.length) ? xq.options : bq.options;
        return { q:pick("q",bq,xq), options:opts, answer:bq.answer, explain:pick("explain",bq,xq) };
      })
    };
  });
  return { lang: code, modules };
}
const mod = id => C.modules.find(m => m.id === id);
const totalLessons = () => C.modules.reduce((n,m) => n + m.lessons.length, 0);
const doneIn = m => m.lessons.filter(l => S.done.includes(l.id)).length;
const doneAll = () => C.modules.reduce((n,m) => n + doneIn(m), 0);
function fmtDate(iso){ const d = new Date(iso); if (isNaN(d)) return iso; const p = n => String(n).padStart(2,"0"); return p(d.getDate())+"-"+p(d.getMonth()+1)+"-"+d.getFullYear(); }

/* ---------- read aloud ---------- */
let SPEAK = {}, speakingId = null, voices = [];
const hasTTS = "speechSynthesis" in window;
const STANDALONE = !!window.AndroidTTS || (function(){ try { return matchMedia("(display-mode: standalone)").matches || document.referrer.indexOf("android-app://") === 0; } catch(e) { return false; } })();
function loadVoices(){ try { voices = speechSynthesis.getVoices() || []; } catch(e) { voices = []; } }
if (hasTTS) { loadVoices(); try { speechSynthesis.onvoiceschanged = loadVoices; } catch(e) {} }
function findVoice(code){
  const n = v => (v.lang || "").toLowerCase().replace("_","-");
  return voices.find(v => n(v) === code+"-in") || voices.find(v => n(v).startsWith(code+"-")) || voices.find(v => n(v) === code) || null;
}
function speakBtn(id, text, lang, compact){
  SPEAK[id] = {text, lang};
  const on = speakingId === id;
  return `<button class="speak ${compact?"compact":""} ${on?"on":""}" data-act="speak" data-sid="${esc(id)}" aria-label="${esc(on?t("stop"):t("listen"))}"><span class="ms">${on?"stop_circle":"volume_up"}</span><span class="lbl">${esc(on?t("stop"):t("listen"))}</span></button>`;
}
function updSpeak(){
  $app.querySelectorAll('[data-act="speak"]').forEach(b => {
    const on = b.dataset.sid === speakingId;
    b.classList.toggle("on", on);
    b.querySelector(".ms").textContent = on ? "stop_circle" : "volume_up";
    b.querySelector(".lbl").textContent = on ? t("stop") : t("listen");
    b.setAttribute("aria-label", on ? t("stop") : t("listen"));
  });
}
function stopSpeak(){ speakingId = null; if (hasTTS) { try { speechSynthesis.cancel(); } catch(e) {} } updSpeak(); }
function speak(id){
  const item = SPEAK[id]; if (!item) return;
  if (speakingId === id) { stopSpeak(); return; }
  if (!hasTTS) { toast(t("voiceMissing")); return; }
  stopSpeak(); loadVoices();
  const v = findVoice(item.lang);
  if (!v && voices.length) { toast(t("voiceMissing")); return; }
  const parts = item.text.split(/(?<=[.!?।॥])\s+/).filter(Boolean);
  speakingId = id; updSpeak();
  parts.forEach((p, i) => {
    const u = new SpeechSynthesisUtterance(p);
    u.lang = item.lang + "-IN"; if (v) u.voice = v; u.rate = 0.9;
    const end = () => { if (speakingId === id) { speakingId = null; updSpeak(); } };
    u.onerror = end;
    if (i === parts.length - 1) u.onend = end;
    speechSynthesis.speak(u);
  });
}

let toastTimer = null;
function toast(msg){ $toast.textContent = msg; $toast.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { $toast.hidden = true; }, 5000); }

/* ---------- navigation ---------- */
let V;
if (!S.lang) V = {name:"lang", first:true};
else if (!S.name) V = {name:"profile", first:true};
else V = {name:"home"};
if (S.lang) loadLang(); else { STR = Object.assign({}, I18N.en); C = buildContent(["en"]); }

function go(v){ stopSpeak(); clearMT(); V = v; render(); window.scrollTo(0,0); }
function render(){
  const l = LANG_BY[S.lang] || LANG_BY.en;
  $app.dir = (S.lang && l.rtl) ? "rtl" : "ltr";
  $app.lang = S.lang || "en";
  document.documentElement.style.setProperty("--scale", S.scale || 1);
  SPEAK = {};
  $app.innerHTML = VIEWS[V.name]();
  const first = $app.querySelector("[autofocus]"); if (first) first.focus();
  if (window.__afterRender) { try { window.__afterRender(V.name, S.lang); } catch(e) {} }
}

function bar(title, o){
  o = o || {};
  return `<header class="bar" ${o.color?`style="--mc:${o.color}"`:""}>
    ${o.back?`<button class="icon-btn" data-act="${o.back}" data-mid="${esc(o.mid||"")}" aria-label="${esc(t("previous"))}"><span class="ms flip">arrow_back</span></button>`:""}
    <h1>${esc(title)}</h1>
    <div class="bar-actions">${o.actions||""}</div></header>`;
}
const homeActions = () => `
  <button class="icon-btn" data-act="scale" aria-label="${esc(t("textSize"))}" title="${esc(t("textSize"))}"><span class="ms">format_size</span></button>
  <button class="icon-btn" data-act="langs" aria-label="${esc(t("chooseLanguage"))}" title="${esc(t("chooseLanguage"))}"><span class="ms">translate</span></button>
  <button class="icon-btn" data-act="progress" aria-label="${esc(t("myProgress"))}" title="${esc(t("myProgress"))}"><span class="ms">person</span></button>`;

/* ---------- views ---------- */
const VIEWS = {};

VIEWS.lang = () => `${bar(V.first ? "भाषा · ભાષા · Language" : t("chooseLanguage"), {back: V.first ? null : "home"})}
<main class="wrap stack">
  ${V.first ? `<div class="lang-intro"><span class="ms">translate</span><p>अपनी भाषा चुनें<br>તમારી ભાષા પસંદ કરો<br>Choose your language</p></div>` : ""}
  <div class="lang-grid">${LANGS.map(l => `<button class="lang ${S.lang===l.code?"on":""}" data-act="setLang" data-code="${l.code}" lang="${l.code}" dir="${l.rtl?"rtl":"ltr"}"><b>${esc(l.native)}</b><small>${esc(l.english)}</small></button>`).join("")}</div>
</main>`;

VIEWS.profile = () => `${bar(t("profileTitle"), {back: V.first ? null : "progress"})}
<main class="wrap">
  <form id="pf" class="stack" novalidate>
    <div class="center"><span class="avatar" style="margin:0 auto"><span class="ms" style="font-size:2.2rem">person</span></span></div>
    <div class="field"><label for="pf-name">${esc(t("name"))}</label><input id="pf-name" autocomplete="name" value="${esc(S.name)}" ${V.first?"autofocus":""}></div>
    ${V.err ? `<p class="err">${esc(t("nameRequired"))}</p>` : ""}
    <div class="field"><label for="pf-village">${esc(t("village"))} <span class="muted">(${esc(t("optional"))})</span></label><input id="pf-village" value="${esc(S.village)}"></div>
    <div class="field"><label for="pf-id">${esc(t("ashaId"))} <span class="muted">(${esc(t("optional"))})</span></label><input id="pf-id" value="${esc(S.ashaId)}"></div>
    <button class="btn block" type="submit"><span class="ms">check</span>${esc(t("save"))}</button>
  </form>
</main>`;

function moduleCard(m){
  const d = doneIn(m), n = m.lessons.length;
  return `<button class="mod" style="--mc:${m.color}" data-act="module" data-mid="${m.id}">
    <span class="badge"><span class="ms">${m.icon}</span></span>
    <span class="mod-body"><b>${esc(m.title)}</b><small>${esc(m.subtitle)}</small>
      <span class="meter sm"><span style="width:${pct(d,n)}%"></span></span>
      <span class="mod-foot"><span>${esc(t("lessonsCount",{done:d,total:n}))}</span>${S.certs[m.id]?`<span class="ms gold" title="${esc(t("certificate"))}">workspace_premium</span>`:""}</span></span>
    <span class="ms chev flip">chevron_right</span></button>`;
}
VIEWS.home = () => {
  const total = totalLessons(), done = doneAll();
  const fb = S.lang && C.lang !== S.lang;
  return `${bar(t("appName"), {actions: homeActions()})}
<main class="wrap stack">
  <section class="hello">
    <p class="eyebrow">${esc(t("tagline"))}</p>
    <h2>${esc(t("welcome",{name:S.name}))}</h2>
    <span class="meter"><span style="width:${pct(done,total)}%"></span></span>
    <p class="meter-label">${esc(t("overallProgress",{done,total}))}</p>
  </section>
  ${practiceBanner()}
  ${fb ? `<p class="note"><span class="ms">info</span><span>${esc(t("contentFallbackNote",{lang:(LANG_BY[C.lang]||LANG_BY.en).native}))}</span></p>` : ""}
  ${(S.hideInstall || STANDALONE) ? "" : `<div class="install"><span class="ms" style="color:var(--pink)">add_to_home_screen</span><div style="flex:1"><b>${esc(t("installTitle"))}</b><p>${esc(t("installText"))}</p></div><button class="icon-btn" data-act="hideInstall" aria-label="${esc(t("cancel"))}"><span class="ms">close</span></button></div>`}
  <h3 class="section-h">${esc(t("modules"))}</h3>
  <div class="modules">${C.modules.map(moduleCard).join("")}</div>
  <button class="sg-card" data-act="suggest"><span class="badge md"><span class="ms">lightbulb</span></span><span class="mod-body"><b>${esc(t("sgHomeTitle"))}</b><small>${esc(t("sgHomeSub"))}</small></span><span class="ms chev flip">chevron_right</span></button>
</main>`;
};

VIEWS.module = () => {
  const m = mod(V.mid), best = S.best[m.id];
  return `${bar(m.title, {back:"home", color:m.color})}
<main class="wrap stack" style="--mc:${m.color}">
  <div class="intro"><span class="badge"><span class="ms">${m.icon}</span></span><p>${esc(m.subtitle)}</p>${speakBtn("mod-"+m.id, m.title+". "+m.subtitle, m.lang, true)}</div>
  <h3 class="section-h">${esc(t("lessons"))}</h3>
  <div class="lessons">${m.lessons.map((l,i) => { const ok = S.done.includes(l.id);
    return `<button class="les" data-act="lesson" data-mid="${m.id}" data-lid="${l.id}"><span class="badge md"><span class="ms">${l.icon}</span></span><span class="t">${i+1}. ${esc(l.title)}</span><span class="ms state ${ok?"ok":""}">${ok?"check_circle":"play_circle"}</span></button>`; }).join("")}</div>
  ${moduleMedia(m)}
  <button class="btn mc block" data-act="quiz" data-mid="${m.id}"><span class="ms">quiz</span>${esc(t("takeQuiz"))}</button>
  ${best != null ? `<p class="center" style="margin:0;font-weight:600">${esc(t("bestScore",{score:best}))}</p>` : ""}
  ${S.certs[m.id] ? `<button class="btn ghost block" data-act="cert" data-mid="${m.id}"><span class="ms gold">workspace_premium</span>${esc(t("viewCertificate"))}</button>` : ""}
  <button class="linkbtn" data-act="suggest" data-mid="${m.id}" data-topic="0"><span class="ms">edit</span>${esc(t("sgModuleLink"))}</button>
</main>`;
};

VIEWS.lesson = () => {
  const m = mod(V.mid), l = m.lessons.find(x => x.id === V.lid), n = l.cards.length, i = V.i, c = l.cards[i];
  const last = i >= n - 1;
  return `${bar(l.title, {back:"module", mid:m.id, color:m.color})}
<div class="lesson" style="--mc:${m.color}">
  <div class="wrap" style="padding-block:12px 0"><span class="meter page"><span style="width:${pct(i+1,n)}%"></span></span></div>
  <section class="stage" id="stage">
    <span class="badge lg"><span class="ms">${c.icon}</span></span>
    <h2>${esc(c.title)}</h2>
    <p class="body">${esc(c.text)}</p>
    ${c.tip ? `<div class="tip"><span class="ms">lightbulb</span><div><b>${esc(t("keyPoint"))}</b><p>${esc(c.tip)}</p></div></div>` : ""}
    ${speakBtn(l.id+"#"+i, [c.title,c.text,c.tip].filter(Boolean).join(". "), m.lang, false)}
  </section>
  <nav class="pager"><div class="pager-in">
    <button class="btn ghost" data-act="prevCard" ${i===0?"disabled":""}><span class="ms flip">arrow_back</span>${esc(t("previous"))}</button>
    <span class="count">${i+1} / ${n}</span>
    ${last ? `<button class="btn mc" data-act="finishLesson"><span class="ms">check</span>${esc(t("finish"))}</button>`
           : `<button class="btn mc" data-act="nextCard">${esc(t("next"))}<span class="ms flip">arrow_forward</span></button>`}
  </div></nav>
</div>`;
};

const LETTERS = ["A","B","C","D","E","F"];
VIEWS.quiz = () => {
  const m = mod(V.mid), n = m.quiz.length;
  if (V.score != null) {
    return `${bar(t("takeQuiz"), {back:"module", mid:m.id, color:m.color})}
<main class="wrap result" style="--mc:${m.color}">
  <span class="ms huge" style="color:${V.passed?"var(--gold)":"var(--mc-ink)"}">${V.passed?"emoji_events":"menu_book"}</span>
  <h2>${esc(t("yourScore",{score:V.score}))}</h2>
  <p>${esc(V.passed ? t("passed") : t("failed",{pass:PASS}))}</p>
  ${V.passed ? `<button class="btn goldb block" data-act="cert" data-mid="${m.id}"><span class="ms">workspace_premium</span>${esc(t("viewCertificate"))}</button>`
             : `<button class="btn mc block" data-act="quiz" data-mid="${m.id}"><span class="ms">refresh</span>${esc(t("tryAgain"))}</button>`}
  <button class="btn ghost block" data-act="module" data-mid="${m.id}"><span class="ms flip">arrow_back</span>${esc(t("backToModule"))}</button>
</main>`;
  }
  const q = m.quiz[V.i], ans = V.sel != null, right = V.sel === q.answer;
  return `${bar(t("takeQuiz"), {back:"module", mid:m.id, color:m.color})}
<main class="wrap stack" style="--mc:${m.color}">
  <span class="meter page"><span style="width:${pct(V.i+1,n)}%"></span></span>
  <p class="muted" style="margin:0;font-weight:600">${esc(t("question",{n:V.i+1,total:n}))}</p>
  <div class="qhead"><h2>${esc(q.q)}</h2>${speakBtn("q-"+m.id+"-"+V.i, [q.q, ...q.options.map((o,j) => LETTERS[j]+". "+o)].join(". "), m.lang, true)}</div>
  <div class="opts">${q.options.map((o,j) => {
    const cls = !ans ? "" : j === q.answer ? "ok" : j === V.sel ? "bad" : "dim";
    const end = !ans ? "" : j === q.answer ? `<span class="ms end">check_circle</span>` : j === V.sel ? `<span class="ms end">cancel</span>` : "";
    return `<button class="opt ${cls}" data-act="choose" data-opt="${j}" ${ans?"disabled":""}><span class="l">${LETTERS[j]}</span><span class="tx">${esc(o)}</span>${end}</button>`; }).join("")}</div>
  ${ans ? `<div class="explain ${right?"ok":"bad"}"><span class="ms" style="color:var(--${right?"good":"bad"})">${right?"check_circle":"info"}</span><div><b>${esc(right?t("correct"):t("wrong"))}</b><p>${esc(q.explain)}</p></div></div>
  <button class="btn mc block" data-act="qnext">${esc(V.i < n-1 ? t("next") : t("finish"))}<span class="ms flip">arrow_forward</span></button>` : ""}
</main>`;
};

VIEWS.cert = () => {
  const m = mod(V.mid), date = S.certs[m.id], score = S.best[m.id] || 0;
  const waText = t("certTitle")+" – "+m.title+"\n"+S.name+(S.village?", "+S.village:"")+"\n"+t("certScore",{score})+"\n"+t("certDate",{date:fmtDate(date)});
  return `${bar(t("certificate"), {back:"module", mid:m.id})}
<main class="wrap stack">
  <div class="cert" style="--mc:${m.color}"><div class="cert-in">
    <span class="ms">workspace_premium</span>
    <h2>${esc(t("certTitle"))}</h2>
    <span class="sm">${esc(t("certCertify"))}</span>
    <span class="who">${esc(S.name)}</span>
    ${S.village ? `<span class="sm">${esc(S.village)}</span>` : ""}
    ${S.ashaId ? `<span class="sm">${esc(t("ashaId"))}: ${esc(S.ashaId)}</span>` : ""}
    <span class="sm" style="margin-top:8px">${esc(t("certCompleted"))}</span>
    <span class="modname">${esc(m.title)}</span>
    <b>${esc(t("certScore",{score}))}</b>
    <span class="sm">${esc(t("certDate",{date:fmtDate(date)}))}</span>
    <small><b style="color:#9C1049">${esc(t("appName"))}</b><br>${esc(t("certDisclaimer"))}</small>
  </div></div>
  <p class="note"><span class="ms">screenshot_monitor</span><span>${esc(t("screenshotTip"))}</span></p>
  <a class="btn wa block" href="https://wa.me/?text=${encodeURIComponent(waText)}" target="_blank" rel="noopener"><span class="ms">send</span>${esc(t("openWhatsApp"))}</a>
</main>`;
};

VIEWS.progress = () => `${bar(t("myProgress"), {back:"home"})}
<main class="wrap stack">
  <div class="card prof"><span class="avatar"><span class="ms">person</span></span>
    <div style="flex:1;min-width:0"><b>${esc(S.name)}</b><span class="muted">${esc([S.village, S.ashaId ? t("ashaId")+": "+S.ashaId : ""].filter(Boolean).join(" · "))}</span></div>
    <button class="icon-btn" data-act="editProfile" aria-label="${esc(t("editProfile"))}" title="${esc(t("editProfile"))}"><span class="ms">edit</span></button></div>
  <button class="card prow" data-act="practice" style="text-align:start;--mc:#B8175A"><span class="prow-top"><span class="badge md"><span class="ms">play_circle</span></span><b>${esc(t("practiceTitle"))}</b><span class="ms chev flip">chevron_right</span></span>
      <span class="meter sm"><span style="width:${pct(mDoneCount(),MEDIA.items.length)}%"></span></span>

/* ---------- video player ---------- */
const sceneDur = cap => Math.max(4500, cap.length * 75);
function narrate(text, onEnd){
  if (S.mvoice === false || !hasTTS) return false;
  loadVoices();
  const lang = mcode(), v = findVoice(lang);
  if (!v && voices.length) { if (!MT.warned) { MT.warned = true; toast(t("voiceMissing")); } return false; }
  try { speechSynthesis.cancel(); } catch(e) {}
  const parts = text.split(/(?<=[.!?।॥])\s+/).filter(Boolean);
  try {
    parts.forEach((p, i) => {
      const u = new SpeechSynthesisUtterance(p);
      u.lang = lang + "-IN"; if (v) u.voice = v; u.rate = 0.9;
      if (i === parts.length - 1) { u.onend = onEnd; u.onerror = onEnd; }
      speechSynthesis.speak(u);
    });
  } catch(e) { return false; }
  return true;
}
function runScene(){
  clearMT(); stopSpeak();
  const it = MI[V.iid], cap = mt(V.iid).caps[V.i] || "", est = sceneDur(cap);
  let minT = false, spEnd = true;
  const go2 = () => { if (minT && spEnd) later(advanceScene, 900); };
  const tok = MT.tok;
  if (narrate(cap, () => { if (tok !== MT.tok) return; spEnd = true; go2(); })) { spEnd = false; later(advanceScene, est * 1.8 + 4000); }
  later(() => { minT = true; go2(); }, est);
}
function advanceScene(){
  if (V.name !== "video") return;
  const it = MI[V.iid];
  clearMT();
  if (V.i < it.scenes.length - 1) { V.i++; render(); runScene(); }
  else { V.playing = false; V.ended = true; stopSpeak(); markDone(V.iid); render(); }
}

  const endI = j => !ans ? "" : j === q.answer ? `<span class="ms end">check_circle</span>` : j === V.sel ? `<span class="ms end">cancel</span>` : "";
  const opts = q.opts
    ? `<div class="popts ${q.wide ? "wide" : ""}">${q.opts.map((o, j) => `<button class="popt ${mark(j)}" data-act="pchoose" data-opt="${j}" ${ans ? "disabled" : ""} aria-label="${LETTERS[j]}. ${esc(qt.options[j])}"><span class="l">${LETTERS[j]}</span>${pic(o)}${ans || q.label ? `<small>${esc(qt.options[j])}</small>` : ""}${endI(j)}</button>`).join("")}</div>`
    : `<div class="opts">${qt.options.map((o, j) => `<button class="opt ${mark(j)}" data-act="pchoose" data-opt="${j}" ${ans ? "disabled" : ""}><span class="l">${LETTERS[j]}</span><span class="tx">${esc(o)}</span>${endI(j)}</button>`).join("")}</div>`;
  return `${head}
<main class="wrap stack" style="--mc:${col}">
  <span class="meter page"><span style="width:${pct(V.i + 1, n)}%"></span></span>
  <p class="muted" style="margin:0;font-weight:600">${esc(t("question", {n:V.i + 1, total:n}))}</p>
  ${q.pic ? `<div class="qpic">${pic(q.pic)}</div>` : ""}
  <div class="qhead"><h2>${esc(qt.q)}</h2>${speakBtn("pq-" + V.i, [qt.q, ...qt.options.map((o, j) => LETTERS[j] + ". " + o)].join(". "), lang, true)}</div>
  ${opts}
  ${ans ? `<div class="explain ${right ? "ok" : "bad"}" id="info"><span class="ms" style="color:var(--${right ? "good" : "bad"})">${right ? "check_circle" : "info"}</span><div><b>${esc(right ? t("correct") : t("wrong"))}</b><p>${esc(qt.explain)}</p></div></div>
  <button class="btn mc block" data-act="pnext">${esc(V.i < n - 1 ? t("next") : t("finish"))}<span class="ms flip">arrow_forward</span></button>` : ""}
</main>`;
};

/* ---------- put the steps in order ---------- */
function shuffled(n){
  const a = Array.from({length:n}, (_, i) => i);
  do { for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } }
  while (n > 2 && a.every((x, i) => x === i));
  return a;
}
VIEWS.order = () => {
  const it = MI[V.iid], tx = mt(V.iid), col = mcolor(it), R = it.rounds.length;
  const head = bar(tx.title, Object.assign({color:col}, backOpt()));
  if (V.r >= R) return `${head}<main class="wrap stack" style="--mc:${col}">${doneBlock(t("activityDone"))}</main>`;
  const rd = tx.rounds[V.r], steps = rd.steps, all = V.picked.length >= steps.length;
  return `${head}
<main class="wrap stack" style="--mc:${col}">
  <span class="meter page"><span style="width:${pct(V.r + 1, R)}%"></span></span>
  <p class="muted" style="margin:0;font-weight:700">${esc(t("setOf", {n:V.r + 1, total:R}))}</p>
  <p class="who" style="text-align:start">${esc(rd.t)}</p>
  <p style="margin:0;font-weight:600">${esc(all ? t("orderGood") : t("orderHint"))}</p>
  ${V.picked.length ? `<div class="steps">${V.picked.map((k, i) => `<div class="step ok"><span class="n">${i + 1}</span><span>${esc(steps[k])}</span></div>`).join("")}</div>` : ""}
  ${all ? `<button class="btn mc block" data-act="onext">${esc(V.r < R - 1 ? t("nextSet") : t("finish"))}<span class="ms flip">arrow_forward</span></button>`
        : `<hr class="divider"><div class="steps">${V.order.filter(k => !V.picked.includes(k)).map(k => `<button class="step ${V.wrong === k ? "no" : ""}" data-act="opick" data-k="${k}"><span class="n">?</span><span>${esc(steps[k])}</span></button>`).join("")}</div>`}
</main>`;
};

function scrollInfo(){ const el = document.getElementById("info"); if (el && el.scrollIntoView) { try { el.scrollIntoView({block:"nearest", behavior:"smooth"}); } catch(e) { el.scrollIntoView(false); } } }

Object.assign(ACT, {
  practice: () => go({name:"practice"}),
  mback: () => { const b = V.back || {name:"practice"}; go(Object.assign({}, b)); },
  mopen: d => {
    const it = MI[d.iid]; if (!it) return;
    const back = V.name === "module" ? {name:"module", mid:V.mid} : (V.back && MI[V.iid] ? V.back : {name:"practice"});
    const base = {iid:it.id, back};
    if (it.kind === "video") go(Object.assign(base, {name:"video", i:0, playing:false, started:false, ended:false}));
    else if (it.kind === "tap") go(Object.assign(base, {name:"tap", seen:[], sel:null}));
    else if (it.kind === "find") go(Object.assign(base, {name:"find", found:[], safeSeen:[], msg:null, hint:null}));
    else if (it.kind === "breath") go(Object.assign(base, {name:"breath", c:0, phase:"ready", count:null, ans:null, right:0}));
    else if (it.kind === "pquiz") go(Object.assign(base, {name:"pquiz", i:0, sel:null, correct:0, score:null}));
    else if (it.kind === "order") go(Object.assign(base, {name:"order", r:0, picked:[], order:shuffled(mt(it.id).rounds[0].steps.length), wrong:null}));
  },
  /* video */
  vplay: () => { if (V.ended) { V.i = 0; V.ended = false; } V.started = true; V.playing = true; render(); runScene(); },
  vpause: () => { V.playing = false; clearMT(); stopSpeak(); render(); },
  vprev: () => { if (V.i > 0) { V.i--; V.ended = false; V.started = true; render(); if (V.playing) runScene(); } },
  vnext: () => { const n = MI[V.iid].scenes.length; if (V.i < n - 1) { V.i++; V.ended = false; V.started = true; render(); if (V.playing) runScene(); } },
  vvoice: () => { S.mvoice = S.mvoice === false; save(); if (V.playing) { render(); runScene(); } else { stopSpeak(); render(); } },
  /* tap */
  tspot: d => { const k = +d.k; V.sel = k; if (!V.seen.includes(k)) V.seen.push(k); stopSpeak();
    if (V.seen.length >= MI[V.iid].spots.length) markDone(V.iid); render(); scrollInfo(); },
  /* find */
  fspot: d => { const k = d.k; stopSpeak();
    if (d.kind === "t") { if (!V.found.includes(k)) V.found.push(k); if (V.hint === k) V.hint = null; }
    else if (!V.safeSeen.includes(k)) V.safeSeen.push(k);
    V.msg = {k, kind:d.kind};
    if (V.found.length >= MI[V.iid].targets.length) markDone(V.iid);
    render(); scrollInfo(); },
  fhint: () => { const left = MI[V.iid].targets.find(x => !V.found.includes(x[0])); if (left) { V.hint = left[0]; render(); } },
  /* breath */
  bstart: () => { clearMT(); V.phase = "count"; V.count = 0; V.left = 60; render();
    const tok = MT.tok;
    const h = setInterval(() => { if (tok !== MT.tok || V.name !== "breath") { clearInterval(h); return; }
      V.left--; const el = document.getElementById("bleft"); if (el) el.textContent = t("secondsLeft", {s:V.left});
      if (V.left <= 0) { clearInterval(h); V.phase = "ask"; render(); } }, 1000);
    MT.timers.push(h); },
  btap: (d, el) => { if (V.phase !== "count") return; V.count++; const c = document.getElementById("bcount"); if (c) c.textContent = V.count;
    if (el) { el.classList.add("bump"); setTimeout(() => el.classList.remove("bump"), 90); } },
  bskip: () => { clearMT(); V.phase = "ask"; V.count = null; render(); },
  bans: d => { const cs = MI[V.iid].cases[V.c]; V.ans = d.v === "1"; if (V.ans === cs.fast) V.right++; V.phase = "result"; render(); scrollInfo(); },
  bnext: () => { stopSpeak(); V.c++; V.phase = "ready"; V.count = null; V.ans = null;
    if (V.c >= MI[V.iid].cases.length) markDone(V.iid, {best:Math.round(V.right * 100 / MI[V.iid].cases.length)});
    render(); window.scrollTo(0, 0); },
  /* picture quiz */
  pchoose: d => { if (V.sel != null) return; const q = MI[V.iid].qs[V.i]; V.sel = +d.opt; if (V.sel === q.answer) V.correct++; stopSpeak(); render(); scrollInfo(); },
  pnext: () => { const it = MI[V.iid]; stopSpeak();
    if (V.i < it.qs.length - 1) { V.i++; V.sel = null; render(); window.scrollTo(0, 0); return; }
    const score = Math.round(V.correct * 100 / it.qs.length), prev = (S.media[it.id] && S.media[it.id].best) || 0;
    markDone(it.id, {best:Math.max(prev, score)}); V.score = score; render(); window.scrollTo(0, 0); },
  /* order */
  opick: d => { const k = +d.k; if (k === V.picked.length) { V.picked.push(k); V.wrong = null; } else { V.wrong = k; toast(t("orderWrong")); } render(); },
  onext: () => { const it = MI[V.iid]; V.r++; V.picked = []; V.wrong = null;
    if (V.r < it.rounds.length) V.order = shuffled(mt(it.id).rounds[V.r].steps.length); else markDone(it.id);
    render(); window.scrollTo(0, 0); }
});
/* ================= end Watch & Practise ================= */
/* ================= Send a suggestion (opens the phone's email app) ================= */
const APP_VER = "1.4.1";
const SUGGEST_TO = "gajerakrupal17@gmail.com";
const SG_KEYS = ["sgT0","sgT1","sgT2","sgT3"];
const SG_EN = ["Mistake in a lesson","New topic or lesson","Problem in the app","Other idea"];
function sgBody(){
  const lines = ["Topic: " + SG_EN[V.topic] + (S.lang && S.lang !== "en" ? " (" + t(SG_KEYS[V.topic]) + ")" : "")];
  if (V.mid) {
    const m = CONTENT.en.modules.find(x => x.id === V.mid);
    lines.push("Module: " + (V.mid === "practice" ? "Watch & Practise" : (m ? m.title : V.mid)));
  }
  lines.push("", (V.text || "").trim(), "");
  if (V.addMe) {
    if (S.name) lines.push("Name: " + S.name);
    if (S.village) lines.push("Village: " + S.village);
    if (S.ashaId) lines.push("ASHA ID: " + S.ashaId);
  }
  lines.push("App: ASHA Shiksha " + APP_VER + (window.AndroidTTS ? " (Android)" : " (web)") + ", " + (LANG_BY[S.lang] || LANG_BY.en).english);
  return lines.join("\n");
}
function sgBackOf(){
  if (V.name === "module") return {name:"module", mid:V.mid};
  if (V.name === "progress") return {name:"progress"};
  return {name:"home"};
}
VIEWS.suggest = () => `${bar(t("sgTitle"), {back:"sgBack"})}
<main class="wrap stack">
  <div class="intro" style="--mc:#B8175A;align-items:flex-start"><span class="badge md"><span class="ms">lightbulb</span></span><p style="font-size:1rem">${esc(t("sgIntro"))}</p></div>
  <fieldset class="sg-topics"><legend>${esc(t("sgTopic"))}</legend>
    <div class="chips-row">${SG_KEYS.map((k, i) => `<button type="button" class="choice ${V.topic === i ? "on" : ""}" data-act="sgTopic" data-i="${i}" aria-pressed="${V.topic === i}">${esc(t(k))}</button>`).join("")}</div></fieldset>
  <div class="field"><label for="sg-mod">${esc(t("sgModule"))}</label>
    <select id="sg-mod"><option value="">${esc(t("sgNone"))}</option>${C.modules.map(m => `<option value="${m.id}" ${V.mid === m.id ? "selected" : ""}>${esc(m.title)}</option>`).join("")}<option value="practice" ${V.mid === "practice" ? "selected" : ""}>${esc(t("practiceTitle"))}</option></select></div>
  <div class="field"><label for="sg-msg">${esc(t("sgMsg"))}</label>
    <textarea id="sg-msg" rows="6" placeholder="${esc(t("sgPlaceholder"))}">${esc(V.text || "")}</textarea></div>
  ${V.err ? `<p class="err">${esc(t("sgNeed"))}</p>` : ""}
  ${S.name ? `<label class="check" for="sg-me"><input type="checkbox" id="sg-me" ${V.addMe ? "checked" : ""}><span>${esc(t("sgAddMe"))}: <b>${esc([S.name, S.village].filter(Boolean).join(", "))}</b></span></label>` : ""}
  <button class="btn block" data-act="sgSend"><span class="ms">send</span>${esc(t("sgSend"))}</button>
  <p class="muted" style="margin:0;font-size:.9rem">${esc(t("sgPrivacy"))}</p>
  ${V.opened ? `<div class="card stack" id="sg-info"><p style="margin:0;font-weight:600">${esc(t("sgOpened"))}</p>
     <p style="margin:0">${esc(t("sgFallback"))}: <b class="sel">${SUGGEST_TO}</b></p>
     <textarea id="sg-copy" class="report" readonly aria-label="${esc(t("sgMsg"))}">${esc(sgBody())}</textarea>
     <div class="row"><button class="btn soft" data-act="sgCopy"><span class="ms">content_copy</span>${esc(t("copy"))}</button></div></div>` : ""}
</main>`;
Object.assign(ACT, {
  suggest: d => go({name:"suggest", topic: d.topic != null ? +d.topic : 0, mid: d.mid || "", text:"", addMe:true, opened:false, err:false, back: sgBackOf()}),
  sgBack: () => go(Object.assign({}, V.back || {name:"home"})),
  sgTopic: d => { V.topic = +d.i; render(); },
  sgSend: () => {
    if (!(V.text || "").trim()) { V.err = true; render(); const el = document.getElementById("sg-msg"); if (el) el.focus(); return; }
    V.err = false; V.opened = true;
    const href = "mailto:" + SUGGEST_TO + "?subject=" + encodeURIComponent("ASHA Shiksha suggestion: " + SG_EN[V.topic]) + "&body=" + encodeURIComponent(sgBody());
    render();
    const box = document.getElementById("sg-info"); if (box && box.scrollIntoView) box.scrollIntoView({block:"nearest"});
    toast(t("sgOpened"));
    try { window.location.href = href; } catch(e) {}
  },
  sgCopy: () => { const ta = document.getElementById("sg-copy"); const txt = ta ? ta.value : sgBody();
    const fallback = () => { if (ta) { ta.focus(); ta.select(); } toast(t("copyManual")); };
    try { navigator.clipboard.writeText(txt).then(() => toast(t("copied")), fallback); } catch(e) { fallback(); } }
});
$app.addEventListener("input", e => {
  if (V.name !== "suggest" || e.target.id !== "sg-msg") return;
  V.text = e.target.value;
  if (V.err && V.text.trim()) { V.err = false; const p = $app.querySelector(".err"); if (p) p.remove(); }
});
$app.addEventListener("change", e => {
  if (V.name !== "suggest") return;
  if (e.target.id === "sg-mod") V.mid = e.target.value;
  if (e.target.id === "sg-me") V.addMe = e.target.checked;
});
/* ================= end Send a suggestion ================= */

$app.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  e.preventDefault(); fn(el.dataset, el);
});
$app.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id !== "pf") return;
  const name = document.getElementById("pf-name").value.trim();
  if (!name) { V.err = true; render(); return; }
  S.name = name;
  S.village = document.getElementById("pf-village").value.trim();
  S.ashaId = document.getElementById("pf-id").value.trim();
  save(); go(V.first ? {name:"home"} : {name:"progress"});
});
/* swipe between lesson cards */
let sx = null, sy = null;
$app.addEventListener("touchstart", e => { if (!e.target.closest("#stage")) return; sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
$app.addEventListener("touchend", e => {
  if (sx == null || V.name !== "lesson") { sx = null; return; }
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
  if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  const forward = ($app.dir === "rtl") ? dx > 0 : dx < 0;
  (forward ? ACT.nextCard : ACT.prevCard)();
}, {passive:true});

(function(){ try {
  const h = new URLSearchParams(location.hash.slice(1)), mid = h.get('m'), lid = h.get('l');
  if (mid && V.name === 'home') { const m = C.modules.find(x => x.id === mid);
    if (m) V = (lid && m.lessons.some(x => x.id === lid)) ? {name:'lesson', mid, lid, i:0} : {name:'module', mid}; }
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
} catch(e) {} })();
render();
})();
</script>
