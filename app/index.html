ે તૈયાર છે કે નહીં તે જાણો (Assess). છોડવાની તારીખ નક્કી કરવા અને તલપ સંભાળવામાં મદદ કરો (Assist). ફોલો-અપ ગોઠવો અને તમાકુ મુક્તિ કેન્દ્રમાં રેફર કરો (Arrange).","tip":"મોટાભાગના લોકોને છોડવા માટે ઘણા પ્રયાસ કરવા પડે છે. પ્રોત્સાહન આપતા રહો."},{"title":"તમાકુનો કાયદો અને દારૂ","text":"કાયદા (COTPA) મુજબ જાહેર જગ્યાએ ધૂમ્રપાન પર પ્રતિબંધ છે અને 18 વર્ષથી નાના લોકોને કે શાળાથી 100 વાર અંદર તમાકુ વેચી શકાતી નથી. દારૂ લીવર, હૃદય અને કુટુંબજીવનને નુકસાન કરે છે, અને અકસ્માત તથા હિંસા લાવે છે. દારૂ છોડવા માગતા લોકોને MO પાસે મોકલો.","tip":"ટેલી-માનસ 14416 પણ વ્યસનમાં મદદ કરી શકે છે."}]},{"id":"life.active","title":"શારીરિક પ્રવૃત્તિ અને યોગ્ય વજન","cards":[{"title":"રોજ હલનચલન કરો","text":"પુખ્તોએ અઠવાડિયામાં ઓછામાં ઓછા 5 દિવસ, રોજ ઓછામાં ઓછી 30 મિનિટ ઝડપથી ચાલવું, સાઇકલ, યોગ કે બીજી પ્રવૃત્તિ કરવી જોઈએ. બાળકોએ રોજ ઓછામાં ઓછો 1 કલાક દોડધામવાળી રમત રમવી જોઈએ.","tip":"સમૂહમાં સાથે ચાલવાથી ચાલુ રાખવું સરળ બને છે."},{"title":"કમરનું માપ અને જોખમ","text":"સ્ત્રીઓમાં 80 સેમીથી વધુ કે પુરુષોમાં 90 સેમીથી વધુ કમર ડાયાબિટીસ, હાઈ BP અને હૃદયરોગનું જોખમ વધારે છે. CBAC ભરતી વખતે નાભિના લેવલે કમર માપો.","tip":"થોડું પણ વજન ઘટાડવાથી જોખમ ઘટે છે."},{"title":"ઊંઘ અને તણાવ","text":"પુખ્તોને 7 થી 8 કલાક ઊંઘ જોઈએ. ઓછો સ્ક્રીન સમય, કુટુંબ સાથે સમય, યોગ અને શ્વાસની કસરતથી તણાવ ઘટે છે. વધુ પડતો મોબાઇલ બાળકોની આંખો, ઊંઘ અને ભણતર માટે નુકસાનકારક છે.","tip":"જમતી વખતે અને સૂતાં પહેલાં મોબાઇલ-મુક્ત સમય રાખો."}]}],"quiz":[{"q":"કુટુંબોએ કયું મીઠું વાપરવું જોઈએ?","options":["કોઈ પણ મીઠું","આયોડિનયુક્ત મીઠું","ફક્ત સિંધવ મીઠું","મીઠું જ નહીં"],"explain":"આયોડિનયુક્ત મીઠું મગજના વિકાસનું રક્ષણ કરે છે અને ગોઇટરથી બચાવે છે."},{"q":"સાબુથી સારી રીતે હાથ ધોવામાં કેટલો સમય લાગવો જોઈએ?","options":["5 સેકન્ડ","લગભગ 40 સેકન્ડ","5 મિનિટ","ફક્ત ઝડપથી પાણી નાખવું"],"explain":"લગભગ 40 સેકન્ડ, હાથના બધા ભાગ ઘસીને."},{"q":"આમાંથી કઈ તમાકુ સુરક્ષિત છે?","options":["ગુટખા","ખૈની","બીડી","એક પણ નહીં"],"explain":"કોઈ પણ તમાકુ સુરક્ષિત નથી."},{"q":"તમાકુ છોડો હેલ્પલાઇન નંબર કયો છે?","options":["108","1800-11-2356","14416","1098"],"explain":"1800-11-2356 મફત તમાકુ છોડો હેલ્પલાઇન છે."},{"q":"પુખ્તોએ કેટલી શારીરિક પ્રવૃત્તિ કરવી જોઈએ?","options":["અઠવાડિયામાં ઓછામાં ઓછા 5 દિવસ 30 મિનિટ","અઠવાડિયે એક વાર 10 મિનિટ","ફક્ત રજાના દિવસે","40 વર્ષ પછી જરૂર નથી"],"explain":"અઠવાડિયામાં 5 કે વધુ દિવસ ઓછામાં ઓછી 30 મિનિટ."},{"q":"એક સ્ત્રીની કમર 92 સેમી છે. એનો અર્થ:","options":["સામાન્ય","ડાયાબિટીસ અને BPનું વધુ જોખમ","ઓછું વજન","ફક્ત કપડાંની વાત"],"explain":"સ્ત્રીઓમાં 80 સેમીથી વધુ કમર જોખમ વધારે છે."}]}]},"en":{"language":"en","modules":[{"id":"mnh","icon":"pregnant_woman","color":"#C2185B","title":"Mother & Newborn Care","subtitle":"Pregnancy care, safe delivery, newborn care and family planning","lessons":[{"id":"mnh.anc","icon":"assignment","title":"Pregnancy registration and check-ups","cards":[{"icon":"assignment","title":"Register early","text":"Register every pregnant woman as soon as pregnancy is confirmed, within the first 12 weeks. Fill the MCP (Mother and Child Protection) card and give it to her. She must bring this card to every visit.","tip":"Early registration = early care. Visit newly married women and ask about missed periods."},{"icon":"calendar_month","title":"At least 4 check-ups","text":"Every pregnant woman needs at least 4 ante-natal check-ups (ANC). The first in the first 3 months. Also motivate her to attend the PMSMA check-up by a doctor on the 9th of every month in the 2nd and 3rd trimester.","tip":"Keep a list of all pregnant women in your area and their next check-up date."},{"icon":"monitor_heart","title":"What is checked at ANC","text":"Weight, blood pressure, haemoglobin (Hb), urine test, blood sugar, belly check for baby's growth, and blood tests for HIV and syphilis. Hb below 11 g/dl means anaemia.","tip":"BP 140/90 or more is high. Refer her to the doctor."},{"icon":"medication","title":"Tablets and injections","text":"Folic acid in the first 3 months. From the 4th month: 1 IFA (iron) tablet daily for at least 180 days and 2 calcium tablets daily. One albendazole (deworming) tablet in the 2nd trimester. Td injection: 2 doses (or 1 booster if given in the last 3 years).","tip":"Take iron and calcium at different times. Iron tablet with lemon water is better absorbed; not with tea."},{"icon":"restaurant","title":"Food and rest","text":"She should eat one extra meal every day: green leafy vegetables, pulses, milk, eggs or meat if she eats them, and fruits. She needs 2 hours of rest in the day and 8 hours of sleep at night. No tobacco or alcohol.","tip":"Talk to the whole family, not only to the woman."}]},{"id":"mnh.danger","icon":"warning","title":"Danger signs in pregnancy","cards":[{"icon":"bloodtype","title":"Bleeding","text":"Any bleeding from the vagina during pregnancy is dangerous. Send her to the hospital at once.","tip":"Call 108 or 102 for free ambulance."},{"icon":"psychology","title":"Headache, blurred vision, fits","text":"Severe headache, blurred vision, swelling of face and hands, or convulsions (fits) are signs of high BP in pregnancy (pre-eclampsia / eclampsia). This can kill the mother and baby.","tip":"Do not wait. Refer immediately to a facility with a doctor."},{"icon":"thermostat","title":"Fever, breathlessness, paleness","text":"High fever, feeling breathless, very pale eyes, tongue and nails (severe anaemia) need urgent care.","tip":"Severe anaemia (Hb below 7) needs treatment at the hospital."},{"icon":"child_friendly","title":"Baby moves less, water leaks","text":"If the baby's movements reduce or stop, or water leaks from the vagina before labour pains, she must go to the hospital at once. Labour lasting more than 12 hours is also dangerous.","tip":"Teach every family these danger signs at the first visit."}]},{"id":"mnh.birth","icon":"local_hospital","title":"Birth preparedness and safe delivery","cards":[{"icon":"checklist","title":"Make a birth plan","text":"Decide in advance: which hospital, how to reach there (108/102 number), who will go with her, money for emergency, and a blood donor from the family.","tip":"Write the phone numbers on the MCP card."},{"icon":"local_hospital","title":"Delivery only in hospital","text":"Every delivery should happen in a health facility with trained staff. Under JSSK, delivery, medicines, tests, food, blood and transport are free in government hospitals. Under JSY, the mother gets cash help.","tip":"Home delivery increases the risk of death for the mother and baby."},{"icon":"bed","title":"Stay 48 hours","text":"After a normal delivery, the mother and baby should stay in the hospital for at least 48 hours. Most dangers like heavy bleeding happen in the first 2 days.","tip":"Visit the mother at home on the day she returns."},{"icon":"warning","title":"Danger signs after delivery","text":"Heavy bleeding, fever, foul-smelling discharge, severe belly pain, fits, or feeling very sad and not caring for the baby. Refer her at once.","tip":"More than 1 pad soaked in 5 minutes means heavy bleeding."}]},{"id":"mnh.hbnc","icon":"child_care","title":"Home-based newborn care (HBNC)","cards":[{"icon":"calendar_month","title":"HBNC home visits","text":"Visit the newborn at home on day 3, 7, 14, 21, 28 and 42 after a hospital delivery. If the baby was born at home, also visit on day 1. Visit low birth weight babies more often.","tip":"Fill the HBNC format at every visit."},{"icon":"favorite","title":"Breastfeed within 1 hour","text":"Start breastfeeding within 1 hour of birth. The first yellow milk (colostrum) is the baby's first vaccine. Give only breast milk for 6 months - no water, honey, ghutti or other milk.","tip":"Feed 8-12 times in 24 hours, day and night."},{"icon":"home","title":"Keep the baby warm","text":"Dry the baby, wrap in clean cloth, cover the head, and keep with the mother. Skin-to-skin contact (Kangaroo Mother Care) is best, especially for small babies. Delay the first bath.","tip":"Keep the cord clean and dry. Do not apply anything on it."},{"icon":"scale","title":"Weigh the baby","text":"Weigh every newborn. A baby weighing less than 2.5 kg is low birth weight and needs extra care: more frequent feeding, KMC, and more visits.","tip":"Babies below 1.8 kg or unable to suck should be referred."},{"icon":"warning","title":"Newborn danger signs","text":"Not able to suck, fits, fast breathing (60 or more per minute), chest in-drawing, very cold or hot body, baby very sleepy or limp, yellow palms and soles, or red and pus-filled cord. Refer at once.","tip":"Count breathing for a full 1 minute when the baby is calm."}]},{"id":"mnh.fp","icon":"family_restroom","title":"Family planning","cards":[{"icon":"family_restroom","title":"Why spacing matters","text":"A gap of at least 3 years between two children keeps the mother and child healthy. The first child should come after the age of 20.","tip":"Talk to the couple together when possible."},{"icon":"medication","title":"Spacing methods","text":"Condoms, daily pills (Mala-N), weekly pill Chhaya, the Antara injection every 3 months, and Copper-T (IUCD) - which can also be put right after delivery (PPIUCD).","tip":"You can give condoms, pills and pregnancy test kits from your drug kit."},{"icon":"health_and_safety","title":"Permanent methods","text":"For couples who do not want more children: sterilisation for women and no-scalpel vasectomy (NSV) for men. NSV is simple and quick. Both are free, and the person receives compensation.","tip":"Clear myths: NSV does not cause weakness in men."}]}],"quiz":[{"q":"When should a pregnancy be registered?","options":["Within the first 12 weeks","In the 6th month","At the time of delivery","After the first check-up"],"answer":0,"explain":"Register within the first 12 weeks (first trimester) so care starts early."},{"q":"How many IFA tablets should a pregnant woman take?","options":["Only when she feels weak","1 daily for at least 180 days","10 tablets in total","Only in the 9th month"],"answer":1,"explain":"From the 4th month, 1 IFA tablet daily for at least 180 days."},{"q":"A pregnant woman has severe headache and blurred vision. What will you do?","options":["Give a pain tablet and wait","Tell her to rest at home","Refer her to the hospital immediately","Visit again next week"],"answer":2,"explain":"These are signs of pre-eclampsia. It is an emergency."},{"q":"When should breastfeeding start?","options":["After 3 days","After the first bath","Within 1 hour of birth","After giving honey"],"answer":2,"explain":"Start within 1 hour. Colostrum protects the baby."},{"q":"A newborn is breathing 64 times in one minute. This is:","options":["Normal","Fast breathing - a danger sign","A sign of hunger","Normal for a sleeping baby"],"answer":1,"explain":"60 or more breaths per minute in a newborn is fast breathing. Refer."},{"q":"HBNC visits after hospital delivery are on:","options":["Day 3, 7, 14, 21, 28, 42","Only day 1","Day 30 and 60","Only when the baby is sick"],"answer":0,"explain":"Six visits: day 3, 7, 14, 21, 28 and 42."}]},{"id":"child","icon":"child_care","color":"#1565C0","title":"Child Health & Immunization","subtitle":"Vaccines, nutrition, diarrhoea, pneumonia and child growth","lessons":[{"id":"child.immun","icon":"vaccines","title":"Immunization schedule","cards":[{"icon":"vaccines","title":"At birth","text":"BCG, OPV zero dose and Hepatitis B birth dose (within 24 hours).","tip":"Babies born in hospital should get these before going home."},{"icon":"vaccines","title":"At 6, 10 and 14 weeks","text":"6 weeks: OPV-1, Pentavalent-1, Rotavirus-1, fIPV-1, PCV-1. 10 weeks: OPV-2, Pentavalent-2, Rotavirus-2. 14 weeks: OPV-3, Pentavalent-3, Rotavirus-3, fIPV-2, PCV-2.","tip":"Check the MCP card and write the next due date."},{"icon":"vaccines","title":"At 9-12 months","text":"MR-1 (Measles-Rubella), fIPV-3, PCV booster, JE-1 (in JE districts), and the first dose of Vitamin A.","tip":"A child who has completed all vaccines by 1 year is 'fully immunized'."},{"icon":"vaccines","title":"At 16-24 months and later","text":"16-24 months: MR-2, JE-2, DPT booster-1, OPV booster, Vitamin A (2nd dose). Then Vitamin A every 6 months till 5 years. DPT booster-2 at 5-6 years. Td at 10 and 16 years.","tip":"Missed doses can be given later - never tell a family it is 'too late'."},{"icon":"groups","title":"Your role on VHSND / session day","text":"Make a due list, call the families a day before, bring the children to the session, and follow up those who did not come. Mild fever or pain after a vaccine is normal. Report any serious reaction to the ANM immediately.","tip":"Find 'zero-dose' children who never got any vaccine."}]},{"id":"child.nutrition","icon":"restaurant","title":"Child nutrition and growth","cards":[{"icon":"restaurant","title":"Food from 6 months","text":"At 6 months, start soft mashed food along with breast milk: thick dal-rice, khichdi, mashed vegetables and fruits, egg. Start with 2-3 spoons and increase slowly. Continue breastfeeding till 2 years or more.","tip":"Food should be thick enough to stay on the spoon."},{"icon":"scale","title":"Monitor growth","text":"Weigh the child every month and mark it on the growth chart in the MCP card. If weight does not increase, or the line goes down, counsel the mother and inform the ANM and Anganwadi worker.","tip":"Go to the Anganwadi with the mother on weighing days."},{"icon":"warning","title":"Severe acute malnutrition (SAM)","text":"Signs: very thin child with visible bones, swelling on both feet, or MUAC (arm band) in the red zone - less than 11.5 cm. Such a child needs referral to the NRC (Nutrition Rehabilitation Centre).","tip":"Use the MUAC tape for children aged 6 months to 5 years."},{"icon":"medication","title":"Vitamin A, iron and deworming","text":"Vitamin A every 6 months from 9 months to 5 years. IFA syrup twice a week for children 6 months to 5 years (Anemia Mukt Bharat). Albendazole deworming every 6 months from 1 year (National Deworming Day).","tip":"Deworming tablet for 1-2 year olds is half tablet, crushed."}]},{"id":"child.diarrhoea","icon":"water_drop","title":"Diarrhoea: ORS and Zinc","cards":[{"icon":"water_drop","title":"ORS for every diarrhoea","text":"Diarrhoea means 3 or more loose stools in a day. Give ORS after every loose stool. Mix one packet in 1 litre of clean drinking water. Use the made solution within 24 hours.","tip":"Show the mother how to prepare ORS - let her do it herself."},{"icon":"medication","title":"Zinc for 14 days","text":"Give zinc for 14 days, even if diarrhoea stops earlier. Child 2-6 months: half tablet (10 mg) daily. Child 6 months to 5 years: 1 tablet (20 mg) daily. Dissolve in breast milk or water.","tip":"Zinc reduces the length of diarrhoea and prevents it in the next months."},{"icon":"restaurant","title":"Continue feeding","text":"Continue breastfeeding and normal food during diarrhoea. Give more fluids. Do not stop food.","tip":"After diarrhoea, give one extra meal daily for 2 weeks."},{"icon":"warning","title":"When to refer","text":"Refer if the child is very sleepy, cannot drink, has sunken eyes, skin pinch goes back very slowly, blood in stool, or diarrhoea for 14 days or more.","tip":"Handwashing with soap and clean water prevents diarrhoea."}]},{"id":"child.pneumonia","icon":"air","title":"Pneumonia in children","cards":[{"icon":"air","title":"Count the breathing","text":"If a child has cough or difficulty in breathing, count breaths for 1 full minute. Fast breathing is: 60 or more (under 2 months), 50 or more (2-12 months), 40 or more (1-5 years).","tip":"Count when the child is calm or sleeping."},{"icon":"warning","title":"Chest in-drawing and danger signs","text":"If the lower chest goes inside when the child breathes in, it is severe pneumonia. Also danger: not able to drink, fits, very sleepy, or vomiting everything.","tip":"Refer at once. Keep the child warm and continue breastfeeding on the way."},{"icon":"local_hospital","title":"Treatment and prevention","text":"Fast breathing needs antibiotic treatment from the ANM or doctor, as per your state's guideline. Prevent pneumonia with breastfeeding, full immunization (including PCV), and a smoke-free home.","tip":"Cooking smoke is harmful. Keep children away from the chulha."}]},{"id":"child.hbyc","icon":"toys","title":"Home-based young child care (HBYC)","cards":[{"icon":"calendar_month","title":"HBYC visits","text":"After HBNC, visit the child at home at 3, 6, 9, 12 and 15 months. Check growth, vaccines, feeding, ORS and zinc at home, and play and communication.","tip":"Use the HBYC checklist."},{"icon":"toys","title":"Play and talk","text":"Children learn by playing and talking. Tell parents to talk, sing and play with the baby every day, and to respond to the baby's sounds and smiles.","tip":"Simple home items like bowls and spoons are good toys."},{"icon":"visibility","title":"Notice delays early","text":"If the child does not smile by 3 months, cannot sit by 9 months, or cannot walk or speak words by 18 months, refer to the RBSK team or DEIC.","tip":"Early help gives the best results."}]}],"quiz":[{"q":"Which vaccines are given at birth?","options":["MR and JE","BCG, OPV-0, Hepatitis B","Pentavalent-1 and PCV-1","Td"],"answer":1,"explain":"BCG, OPV zero dose and Hepatitis B birth dose."},{"q":"When is MR-1 (Measles-Rubella) given?","options":["At birth","At 6 weeks","At 9-12 months","At 5 years"],"answer":2,"explain":"MR-1 at 9-12 months, MR-2 at 16-24 months."},{"q":"For how many days is zinc given in diarrhoea?","options":["3 days","7 days","14 days","Only until diarrhoea stops"],"answer":2,"explain":"Zinc for 14 days, even if the diarrhoea stops earlier."},{"q":"A 1-year-old child breathes 48 times per minute. This is:","options":["Fast breathing","Normal","Slow breathing","Only a cold"],"answer":0,"explain":"For a child of 1-5 years, 40 or more breaths per minute is fast breathing. 48 is fast - refer."},{"q":"MUAC less than 11.5 cm in a child means:","options":["Normal growth","Severe acute malnutrition - refer to NRC","Child is overweight","Needs only vitamins"],"answer":1,"explain":"MUAC below 11.5 cm (red zone) is SAM."},{"q":"When should complementary food start?","options":["At 2 months","At 4 months","At 6 months","At 1 year"],"answer":2,"explain":"Only breast milk till 6 months, then start soft food with breastfeeding."}]},{"id":"cd","icon":"coronavirus","color":"#00796B","title":"Communicable Diseases","subtitle":"TB, leprosy, rabies, water-borne diseases and outbreaks","lessons":[{"id":"cd.tb","icon":"masks","title":"Tuberculosis (TB)","cards":[{"icon":"sick","title":"Signs of TB","text":"Cough for 2 weeks or more, fever especially in the evening, weight loss, night sweats, loss of appetite, or blood in sputum. TB can also affect glands, bones and other parts of the body.","tip":"Any one of these signs = presumptive TB. Send for testing."},{"icon":"science","title":"Testing is free","text":"Help the person give a sputum sample for testing (microscopy or NAAT) at the health centre. Chest X-ray may also be done. Testing and treatment are free in government facilities.","tip":"Collect the sample in the early morning."},{"icon":"medication","title":"Complete the treatment","text":"TB is fully curable. Treatment lasts at least 6 months. The patient must not stop medicines when feeling better. As a treatment supporter, make sure the patient takes medicines daily.","tip":"Stopping treatment early can cause drug-resistant TB."},{"icon":"volunteer_activism","title":"Support for patients","text":"Every TB patient gets monthly nutrition support under Nikshay Poshan Yojana (to the bank account). Screen family members and close contacts; they may get TB preventive treatment.","tip":"Help link the patient's bank account on Ni-kshay."}]},{"id":"cd.leprosy","icon":"healing","title":"Leprosy","cards":[{"icon":"healing","title":"Signs of leprosy","text":"A pale or reddish patch on the skin with loss of feeling (no sensation of touch, pain or heat). Also thick shiny skin, numbness or weakness in hands and feet.","tip":"Touch the patch gently with cotton to check feeling."},{"icon":"medication","title":"Free cure with MDT","text":"Leprosy is curable with Multi-Drug Therapy (MDT), free at government facilities. Early treatment prevents disability. After the first dose, the patient does not spread infection.","tip":"Leprosy is not caused by sin or a curse. Remove stigma."},{"icon":"home","title":"Self-care","text":"Patients with numb hands or feet should check them daily for wounds, soak in water and oil the skin, and wear protective footwear.","tip":"Refer any new weakness, pain in nerves or eye redness."}]},{"id":"cd.rabies","icon":"pets","title":"Dog bite and rabies","cards":[{"icon":"pets","title":"Rabies kills - but can be prevented","text":"Rabies spreads through the bite, scratch or lick on broken skin by an infected dog, cat, monkey or other animal. Once symptoms start, it is almost always fatal. Correct first aid and vaccine prevent it fully.","tip":"Never ignore any animal bite, even a small scratch."},{"icon":"clean_hands","title":"Wash the wound at once","text":"Wash the wound with soap and plenty of running water for 15 minutes. Then apply an antiseptic like povidone-iodine. Do not apply chilli, oil, turmeric or lime. Do not stitch or bandage tightly.","tip":"Washing well removes most of the virus."},{"icon":"vaccines","title":"Vaccine the same day","text":"Send the person to the health centre the same day for anti-rabies vaccine (ARV). Complete all doses on the dates given. Deep bites or bites on the head, face or hands also need rabies immunoglobulin (RIG).","tip":"Vaccine is free in government facilities. Remind the person of every due date."}]},{"id":"cd.water","icon":"water","title":"Water-borne diseases and outbreaks","cards":[{"icon":"water","title":"Safe drinking water","text":"Diarrhoea, cholera, typhoid and jaundice (hepatitis A and E) spread through dirty water and food. Drink boiled or chlorinated water. Store water covered and take it out with a ladle.","tip":"Put chlorine tablets in water as advised by the ANM."},{"icon":"clean_hands","title":"Handwashing","text":"Wash hands with soap and water for 40 seconds: before cooking, before eating, before feeding a child, and after using the toilet or cleaning a child.","tip":"Use a toilet always. No open defecation."},{"icon":"campaign","title":"Report unusual cases","text":"If many people in your village get similar illness at the same time - fever, diarrhoea, jaundice, rash - inform the ANM and PHC immediately. This helps stop an outbreak early (IDSP).","tip":"Also report any death from an unknown illness."}]}],"quiz":[{"q":"A man has cough for 3 weeks and weight loss. What will you do?","options":["Give cough syrup","Send for sputum test for TB","Wait for another month","Tell him to rest"],"answer":1,"explain":"Cough of 2 weeks or more = presumptive TB. Get tested."},{"q":"How long is TB treatment at least?","options":["1 week","1 month","6 months","Until the cough stops"],"answer":2,"explain":"At least 6 months. Do not stop early."},{"q":"A skin patch with loss of feeling may be a sign of:","options":["Allergy","Leprosy","Dengue","Malaria"],"answer":1,"explain":"A patch with loss of sensation is the main sign of leprosy."},{"q":"What is the first aid for a dog bite?","options":["Apply chilli powder","Tie a tight bandage","Wash with soap and running water for 15 minutes","Do nothing if the bite is small"],"answer":2,"explain":"Wash for 15 minutes, apply antiseptic, and get the vaccine the same day."},{"q":"Five people in one street get diarrhoea on the same day. You should:","options":["Inform the ANM and PHC immediately","Wait and watch","Tell only the Sarpanch","Give everyone antibiotics"],"answer":0,"explain":"Clusters of cases may be an outbreak. Report early."}]},{"id":"vbd","icon":"pest_control","color":"#E65100","title":"Vector-borne Diseases (NVBDCP)","subtitle":"Malaria, dengue, chikungunya, filaria, kala-azar, JE and mosquito control","lessons":[{"id":"vbd.malaria","icon":"bug_report","title":"Malaria","cards":[{"icon":"bug_report","title":"How malaria spreads","text":"Malaria spreads by the bite of the female Anopheles mosquito, which bites at night. Signs: fever with chills and shivering, sweating, headache and body ache. Fever may come on alternate days.","tip":"In a malaria area, think of malaria in every fever."},{"icon":"science","title":"Test every fever","text":"Test every fever case with a Rapid Diagnostic Test (RDT) and also make a blood slide, as per your training. Test within 24 hours of fever. Record in the fever register.","tip":"Check the expiry date of RDT kits."},{"icon":"medication","title":"Treat fully","text":"Give treatment as per the age-wise drug chart in your kit. P. vivax: chloroquine for 3 days + primaquine for 14 days. P. falciparum: ACT (artesunate combination) + single dose primaquine. The full course must be completed.","tip":"Do not give primaquine to pregnant women or infants. Refer pregnant women with malaria to the MO."},{"icon":"warning","title":"Severe malaria","text":"Refer at once if there is unconsciousness, fits, repeated vomiting, cannot eat or drink, very pale, yellow eyes, dark urine, or very little urine.","tip":"Severe malaria can kill within hours."}]},{"id":"vbd.dengue","icon":"thermostat","title":"Dengue and chikungunya","cards":[{"icon":"bug_report","title":"Aedes mosquito","text":"Dengue and chikungunya spread by the Aedes mosquito. It has white stripes, bites in the daytime, and breeds in clean stored water: coolers, tanks, tyres, pots, and flower vases.","tip":"One spoon of water is enough for mosquito eggs."},{"icon":"thermostat","title":"Signs","text":"Dengue: sudden high fever, severe headache, pain behind the eyes, body and joint pain, rash. Chikungunya: fever with severe joint pain that may last for weeks.","tip":"Send for the dengue test at the health centre."},{"icon":"local_drink","title":"Home care","text":"Plenty of fluids - ORS, water, coconut water, juice. Rest. Give only paracetamol for fever. Do not give aspirin, ibuprofen or other pain killers - they can cause bleeding.","tip":"Keep the patient under a mosquito net to stop spread."},{"icon":"warning","title":"Warning signs - refer","text":"Severe belly pain, repeated vomiting, bleeding from gums or nose, black stools, cold and clammy skin, restlessness or drowsiness. These usually come as the fever goes down (day 3 to 7).","tip":"Fever going down does not always mean the patient is safe."}]},{"id":"vbd.control","icon":"pest_control","title":"Mosquito control in the village","cards":[{"icon":"delete","title":"Stop breeding","text":"Empty, scrub and dry coolers, tanks and pots once a week ('Dry Day'). Cover all water containers. Throw away old tyres, coconut shells and broken pots, or keep them upside down.","tip":"Do a house-to-house check with families - show them larvae."},{"icon":"bed","title":"Sleep under nets","text":"Everyone, especially pregnant women and children, should sleep under long-lasting insecticidal nets (LLIN) every night. Do not wash the net often. Tuck it under the mattress.","tip":"Use full sleeves, and repellents where available."},{"icon":"home","title":"Spray and fish","text":"Encourage families to allow indoor residual spraying (IRS) and not to plaster or paint walls after spray. Larva-eating fish (Gambusia, guppy) can be put in ponds, wells and tanks.","tip":"Inform the ANM about new breeding sites."}]},{"id":"vbd.filaria","icon":"accessibility","title":"Lymphatic filariasis (hathipaon)","cards":[{"icon":"accessibility","title":"What is filaria","text":"Filaria spreads by the Culex mosquito, which breeds in dirty water. The worm damages the body over years and causes swelling of legs (hathipaon) or hydrocele. Most infected people have no signs for years.","tip":"It can be prevented but swelling cannot be fully cured."},{"icon":"medication","title":"Mass drug administration (MDA)","text":"During MDA, everyone eligible must take the tablets (DEC + albendazole, or with ivermectin - IDA) in front of the health worker. Not given to children under 2 years, pregnant women, and seriously ill people.","tip":"Tell people to eat before taking the tablets."},{"icon":"clean_hands","title":"Care of swollen limbs","text":"Wash the swollen leg daily with soap and water, dry it well, keep the skin clean, exercise and raise the leg. Hydrocele can be cured by a free operation.","tip":"Make a line list of patients with swelling or hydrocele."}]},{"id":"vbd.je_ka","icon":"sick","title":"Japanese Encephalitis and Kala-azar","cards":[{"icon":"psychology","title":"Japanese Encephalitis (JE / AES)","text":"JE spreads by the Culex mosquito from pigs and birds, in rice-growing areas. A child with fever and confusion, unconsciousness or fits needs urgent referral. JE vaccine is given in affected districts at 9 months and 16-24 months.","tip":"Every minute matters in fever with fits."},{"icon":"bug_report","title":"Kala-azar","text":"Kala-azar spreads by the sandfly in some areas of Bihar, Jharkhand, Uttar Pradesh and West Bengal. Signs: fever for more than 2 weeks, big spleen (swelling in the left belly), weight loss, darkening of skin.","tip":"Test (rK39) and treatment are free. Sandflies breed in cracks of mud walls - plaster them."}]}],"quiz":[{"q":"Which mosquito spreads dengue?","options":["Anopheles","Aedes","Culex","Housefly"],"answer":1,"explain":"Aedes, a day-biting mosquito that breeds in clean stored water."},{"q":"In a malaria area, a person has fever. What is the first step?","options":["Give paracetamol and wait 1 week","Test with RDT/blood slide","Give antibiotics","Refer only if fever lasts 1 month"],"answer":1,"explain":"Test every fever within 24 hours."},{"q":"Which medicine can be given for fever in dengue?","options":["Aspirin","Ibuprofen","Paracetamol","Any pain killer"],"answer":2,"explain":"Only paracetamol. Aspirin and ibuprofen can cause bleeding."},{"q":"How often should coolers and water tanks be emptied and dried?","options":["Once a year","Once a week","Once a month","Never"],"answer":1,"explain":"Once a week - Aedes eggs become mosquitoes in about 7 days."},{"q":"Who should NOT take MDA tablets for filaria?","options":["Healthy adults","Children above 2 years","Pregnant women","Elderly healthy people"],"answer":2,"explain":"Not for children under 2, pregnant women, and seriously ill people."},{"q":"Primaquine should not be given to:","options":["Adult men","Pregnant women","Farmers","School children above 8"],"answer":1,"explain":"Primaquine is not given to pregnant women and infants."}]},{"id":"ncd","icon":"monitor_heart","color":"#2E7D32","title":"NCDs & Comprehensive Primary Health Care","subtitle":"BP, diabetes, cancer screening, mental health, elderly care and first aid","lessons":[{"id":"ncd.cbac","icon":"fact_check","title":"Population enumeration and CBAC","cards":[{"icon":"groups","title":"List every family","text":"Make a list of all families and members in your area. Fill the CBAC (Community Based Assessment Checklist) form for every person aged 30 years and above.","tip":"Update the list when there is a birth, death, marriage or migration."},{"icon":"fact_check","title":"CBAC score","text":"CBAC asks about age, tobacco, alcohol, waist size, physical activity, and family history of BP or diabetes. A score of more than 4 means higher risk. It also asks about signs of TB, cancer, and other diseases.","tip":"Everyone above 30 needs screening. Those with score above 4 are a priority."},{"icon":"local_hospital","title":"Mobilise for screening","text":"Bring people to the Ayushman Arogya Mandir (Sub-centre / PHC) for screening of BP, diabetes, and oral, breast and cervical cancer.","tip":"Keep a follow-up list of all people on treatment."}]},{"id":"ncd.htn_dm","icon":"monitor_heart","title":"High BP and diabetes","cards":[{"icon":"monitor_heart","title":"Silent diseases","text":"High BP and diabetes usually have no signs in the beginning. Over years they damage the heart, brain, kidneys and eyes, and cause heart attack and stroke. Only screening can find them early.","tip":"BP 140/90 or more on check-up - send to the CHO/MO."},{"icon":"medication","title":"Medicines every day","text":"Once started, BP and diabetes medicines must be taken every day, usually for life. Do not stop when feeling well. Get free medicines and monthly check-ups from the Ayushman Arogya Mandir.","tip":"Help patients who run out of medicines to get their refill in time."},{"icon":"directions_walk","title":"Healthy lifestyle","text":"Less salt (less than 1 teaspoon a day), less oil, sugar and fried food. More vegetables and fruits. Walk or exercise 30 minutes daily. Stop tobacco and alcohol. Keep weight in control.","tip":"Pickle, papad and namkeen have a lot of salt."},{"icon":"warning","title":"Emergency signs","text":"Sudden weakness of face, arm or leg, difficulty speaking (stroke), chest pain spreading to the arm or jaw, sweating (heart attack). Call 108 immediately.","tip":"In stroke, reaching the hospital in the first 4 hours saves lives."}]},{"id":"ncd.cancer","icon":"health_and_safety","title":"Common cancers: oral, breast, cervical","cards":[{"icon":"smoke_free","title":"Oral cancer","text":"Tobacco (gutkha, khaini, bidi, cigarette) and alcohol cause mouth cancer. Signs: white or red patch in the mouth, ulcer that does not heal in 2 weeks, difficulty opening the mouth.","tip":"Encourage tobacco users to quit. Tobacco quit line: 1800-11-2356."},{"icon":"woman","title":"Breast cancer","text":"Signs: lump in breast or armpit, change in shape of breast, discharge or blood from the nipple, skin like orange peel. Women aged 30 and above should get a breast examination.","tip":"A painless lump also needs a check-up."},{"icon":"woman","title":"Cervical cancer","text":"Signs: bleeding between periods, after sex, or after menopause, and foul-smelling discharge. Women aged 30-65 should get the VIA screening test. HPV vaccine for girls prevents it.","tip":"Cervical cancer is fully curable if found early."}]},{"id":"ncd.mental_elderly","icon":"psychology","title":"Mental health and elderly care","cards":[{"icon":"psychology","title":"Mental health","text":"Signs to notice: sad for more than 2 weeks, not sleeping or eating, not interested in anything, talking to self, hearing voices, very suspicious, or fits (epilepsy). These are illnesses and can be treated.","tip":"Listen without judging. Mental illness is not caused by spirits or black magic."},{"icon":"phone","title":"Get help","text":"Refer to the MO or the district mental health programme. Free counselling on Tele-MANAS: 14416. If a person talks about ending their life, do not leave them alone and get help urgently.","tip":"Also watch for alcohol and drug problems."},{"icon":"elderly","title":"Care for the elderly","text":"Check elderly people for poor vision (cataract), hearing loss, falls, memory loss, and bed sores. Help them get free treatment and pension schemes. For bedridden patients, teach families about palliative care.","tip":"Remove slippery floors and give good light at night to prevent falls."}]},{"id":"ncd.firstaid","icon":"emergency","title":"First aid and emergencies","cards":[{"icon":"emergency","title":"Snake bite","text":"Keep the person calm and still. Remove rings and tight things. Keep the bitten limb still with a splint. Rush to the hospital for anti-snake venom. Do not cut, suck, burn the bite, or tie a tight tourniquet.","tip":"Do not waste time with faith healers."},{"icon":"local_fire_department","title":"Burns","text":"Pour clean cool running water on the burn for 20 minutes. Remove jewellery. Cover with a clean cloth. Do not apply toothpaste, oil, or ink. Refer large or deep burns.","tip":"Wrap the person in a clean sheet to keep them warm."},{"icon":"healing","title":"Bleeding and injuries","text":"Press firmly on the bleeding wound with a clean cloth. Raise the injured part. In a road accident, do not move the neck; call 108.","tip":"Keep the emergency numbers 108 and 102 handy."},{"icon":"wb_sunny","title":"Heat stroke and poisoning","text":"Heat stroke: move to shade, cool with wet cloth, give fluids if awake, refer. Poisoning (pesticide, kerosene): do not make the person vomit, take the container to the hospital.","tip":"Keep pesticides locked and away from children."}]}],"quiz":[{"q":"For whom is the CBAC form filled?","options":["All children","All people aged 30 and above","Only pregnant women","Only sick people"],"answer":1,"explain":"CBAC is filled for everyone aged 30 years and above."},{"q":"A person on BP medicine feels fine now. What should they do?","options":["Stop the medicine","Take it only when there is headache","Continue the medicine daily","Take half dose"],"answer":2,"explain":"BP medicines must be continued daily; feeling well means they are working."},{"q":"An ulcer in the mouth for 3 weeks in a tobacco user may be:","options":["Normal","A sign of oral cancer - refer","Due to spicy food only","A vitamin problem only"],"answer":1,"explain":"Ulcer not healing in 2 weeks needs screening for oral cancer."},{"q":"Tele-MANAS mental health helpline number is:","options":["108","14416","1098","102"],"answer":1,"explain":"Tele-MANAS: 14416, free and available 24x7."},{"q":"First aid for snake bite is:","options":["Cut and suck the wound","Tie a tight rope","Keep the limb still and rush to hospital","Go to a faith healer"],"answer":2,"explain":"Keep calm, immobilise the limb, and reach the hospital for anti-snake venom."},{"q":"What is the first aid for a burn?","options":["Apply toothpaste","Cool running water for 20 minutes","Apply oil","Burst the blisters"],"answer":1,"explain":"Cool running water for 20 minutes, then cover with a clean cloth."}]},{"id":"ado","icon":"girl","color":"#6A1B9A","title":"Adolescent & Women's Health","subtitle":"Adolescent health (RKSK), periods, anaemia and early marriage","lessons":[{"id":"ado.rksk","icon":"groups","title":"Adolescent health (RKSK)","cards":[{"icon":"groups","title":"Who are adolescents","text":"Boys and girls aged 10 to 19 years are adolescents. Their body and mind change fast. They need correct information on nutrition, body changes, mental health, and staying away from tobacco, alcohol and drugs.","tip":"Talk to adolescents with respect and in private. Do not scold or shame them."},{"icon":"local_hospital","title":"Adolescent Friendly Health Clinic","text":"Under RKSK (Rashtriya Kishor Swasthya Karyakram), adolescents can get free counselling and treatment at Adolescent Friendly Health Clinics (AFHC) at PHC, CHC and district hospitals. Everything they share is kept confidential.","tip":"Tell adolescents the day and place of the clinic nearest to them."},{"icon":"volunteer_activism","title":"Peer educators","text":"In each village, peer educators (Saathiya) — 2 boys and 2 girls — are chosen to share health messages with other adolescents. Help them organise the Adolescent Health and Wellness Day in your village.","tip":"Adolescents often listen to friends more than to adults."}]},{"id":"ado.mhm","icon":"water_drop","title":"Periods and menstrual hygiene","cards":[{"icon":"calendar_month","title":"Periods are normal","text":"Periods (menstruation) usually start between 10 and 15 years of age. A normal cycle comes every 21 to 35 days and bleeding lasts 2 to 7 days. It is a normal, healthy body process, not an illness or something dirty.","tip":"Talk to girls about periods before they start, so they are not scared."},{"icon":"clean_hands","title":"Staying clean","text":"Use a clean sanitary pad or a clean cotton cloth. Change it every 4 to 6 hours. Wash reusable cloth with soap and dry it in sunlight. Wrap used pads in paper and put them in a dustbin, or burn or bury them. Wash hands before and after changing.","tip":"Drying cloth in the sun kills germs. Do not hide it in a dark, damp place."},{"icon":"lightbulb","title":"Break the myths","text":"During periods a girl can bathe, go to school, play, cook and eat all normal foods, including sour foods. There is no need to keep her separate from the family.","tip":"Talk to mothers too — they decide many home rules."},{"icon":"warning","title":"When to refer","text":"Refer to the doctor if: bleeding is very heavy (a pad soaked in 1 to 2 hours), bleeding lasts more than 7 days, very severe pain, no period for 3 months (and not pregnant), or no periods at all by 15 years of age.","tip":"Heavy periods can cause anaemia. Check her Hb."}]},{"id":"ado.anaemia","icon":"bloodtype","title":"Anaemia Mukt Bharat","cards":[{"icon":"sick","title":"What is anaemia","text":"Anaemia means low haemoglobin (Hb) in the blood. Signs: tiredness, weakness, breathlessness, dizziness, and pale eyes, tongue and nails. It reduces a child's ability to study and increases risk to mothers in pregnancy.","tip":"Hb below 12 g/dl in adolescent girls and non-pregnant women is anaemia; below 11 g/dl in pregnant women."},{"icon":"medication","title":"Weekly iron tablet (WIFS)","text":"Adolescents 10 to 19 years: 1 blue IFA tablet every week, the whole year, given in school or by you at the Anganwadi for out-of-school adolescents. Women of reproductive age (not pregnant or breastfeeding): 1 red IFA tablet every week. Deworming with albendazole twice a year (National Deworming Day).","tip":"Take the iron tablet after food to reduce stomach upset. Black stool is normal."},{"icon":"restaurant","title":"Iron-rich food","text":"Eat green leafy vegetables, pulses, sprouts, jaggery, dates, eggs, meat or fish. Eat vitamin C fruits like amla, guava or lemon with meals — it helps the body take up iron. Do not drink tea or coffee within 1 hour of meals.","tip":"Cooking in an iron kadai adds iron to food."},{"icon":"science","title":"Test, Treat, Talk (T3)","text":"Help people get their Hb tested at T3 camps and at the health centre. People with anaemia are given treatment doses of iron. Severe anaemia (Hb below 7 g/dl) must be referred to the hospital.","tip":"Keep a list of anaemic girls and women and follow them up every month."}]},{"id":"ado.marriage","icon":"family_restroom","title":"Right age for marriage and pregnancy","cards":[{"icon":"info","title":"Legal age of marriage","text":"By law, a girl must be at least 18 years old and a boy at least 21 years old to marry. Early marriage harms a girl's health and education.","tip":"If you hear of a child marriage, inform the ANM, the Anganwadi worker or call Childline 1098."},{"icon":"pregnant_woman","title":"First pregnancy after 20","text":"Pregnancy before 20 years of age is risky: more anaemia, high BP, difficult delivery, and low birth weight babies. Newly married couples can delay the first pregnancy using condoms or pills.","tip":"Give newly married couples the Nayi Pahal kit and explain the methods."},{"icon":"psychology","title":"Mental health of adolescents","text":"Watch for adolescents who stay sad, stop going to school, stop eating, fight a lot, or start using tobacco, alcohol or drugs. Listen to them without judging and connect them to the AFHC counsellor or Tele-MANAS 14416.","tip":"Exam stress and family problems are common. A kind word helps."}]}],"quiz":[{"q":"Adolescents are people in which age group?","options":["5 to 9 years","10 to 19 years","20 to 24 years","Only 13 to 15 years"],"answer":1,"explain":"Adolescents are 10 to 19 years old."},{"q":"How often should a sanitary pad or cloth be changed?","options":["Once a day","Every 4 to 6 hours","Only when fully soaked","Every 2 days"],"answer":1,"explain":"Change every 4 to 6 hours to stay clean and prevent infection."},{"q":"Under WIFS, how often does an adolescent take the blue IFA tablet?","options":["Every day","Once a week","Once a month","Only when sick"],"answer":1,"explain":"One blue IFA tablet every week, throughout the year."},{"q":"Which drink should NOT be taken with meals because it reduces iron absorption?","options":["Lemon water","Tea","Water","Buttermilk"],"answer":1,"explain":"Tea and coffee reduce iron absorption. Avoid them for 1 hour around meals."},{"q":"What is the legal minimum age of marriage for a girl in India?","options":["16 years","18 years","21 years","14 years"],"answer":1,"explain":"Girls: 18 years. Boys: 21 years."},{"q":"A 15-year-old girl says her period soaks a pad every hour. You should:","options":["Tell her it is normal","Refer her to the doctor and check Hb","Tell her to eat less","Wait for 6 months"],"answer":1,"explain":"Very heavy bleeding needs a doctor and can cause anaemia."}]},{"id":"role","icon":"badge","color":"#455A64","title":"ASHA Role, Records & Communication","subtitle":"Your duties, village meetings, registers, home visits and counselling","lessons":[{"id":"role.duties","icon":"badge","title":"Who is an ASHA","cards":[{"icon":"person","title":"A link between people and the health system","text":"ASHA means Accredited Social Health Activist. You are a woman from the village, chosen by the village, usually one ASHA for about 1000 people. You connect families with health services.","tip":"You are the first person families come to for health help. Your trust is your strength."},{"icon":"checklist","title":"Your three roles","text":"1. Facilitator — you bring people to services like ANC, immunization, delivery and screening. 2. Service provider — you give first aid, ORS, zinc, IFA, contraceptives, pregnancy test kits and malaria tests. 3. Activist — you make the village aware of its health rights.","tip":"Always tell families which services are free."},{"icon":"medication","title":"Your drug kit","text":"Your kit has: ORS, zinc, paracetamol, IFA tablets, albendazole, condoms, oral pills, pregnancy test kit, cotton, bandage, antiseptic, and malaria RDT and medicines where needed. Check expiry dates and refill at the monthly PHC meeting.","tip":"Keep the kit clean, dry and away from children."}]},{"id":"role.meetings","icon":"groups","title":"VHSNC, VHSND and meetings","cards":[{"icon":"groups","title":"Village Health, Sanitation and Nutrition Committee","text":"The VHSNC plans health, water, sanitation and nutrition work for the village. It meets every month. The ASHA is the member-secretary or convenor. The committee has an untied fund that can be used for village needs, such as cleaning drives or emergency help for poor families.","tip":"Keep minutes of every meeting and a record of how the fund is spent."},{"icon":"calendar_month","title":"VHSND — village health day","text":"Village Health, Sanitation and Nutrition Day is held every month at the Anganwadi with the ANM and Anganwadi worker. Services: ANC check-ups, immunization, weighing children, nutrition counselling, family planning and NCD screening.","tip":"Bring the due list. Make home visits the day before to remind families."},{"icon":"local_hospital","title":"Monthly meeting at PHC","text":"Attend the monthly ASHA meeting at the PHC or health centre. Here you share your work, learn new things, solve problems, refill your drug kit and submit claims for incentives.","tip":"Write down your questions during the month and ask them at the meeting."}]},{"id":"role.records","icon":"menu_book","title":"Records and incentives","cards":[{"icon":"menu_book","title":"Your registers","text":"Keep your ASHA diary or register up to date: household list, eligible couples, pregnant women, births and deaths, immunization due list, children under 5, fever and TB cases, and people aged 30+ with CBAC.","tip":"Write the same day. Memory fades, records do not."},{"icon":"fact_check","title":"Correct records save lives","text":"Your records help the ANM and doctor know who needs care. Correct numbers help plan vaccines, medicines and camps. Never write something that did not happen.","tip":"Check your list with the ANM and Anganwadi worker every month."},{"icon":"workspace_premium","title":"Incentives","text":"You get a fixed monthly amount for routine work and extra incentives for specific tasks, such as institutional delivery, full immunization, TB treatment support and family planning. Payment comes directly to your bank account.","tip":"Keep copies of your claim forms. Ask your ASHA facilitator if payment is late."}]},{"id":"role.ipc","icon":"campaign","title":"Home visits and counselling","cards":[{"icon":"home","title":"Which homes first","text":"Visit these homes first: pregnant women, newborns and mothers after delivery, children under 2 years, sick people, TB patients, and bedridden or elderly people. Plan your visits every week.","tip":"Carry your register, MCP cards and drug kit on every visit."},{"icon":"campaign","title":"Good counselling","text":"Greet with respect. Ask questions and listen fully. Use simple words and pictures. Give one or two main messages at a time. Ask them to repeat the message back to check understanding. Agree on the next step.","tip":"Listen more than you speak."},{"icon":"family_restroom","title":"Include the family","text":"Many decisions are made by the husband or mother-in-law. Include them when talking about delivery, family planning or nutrition. Respect privacy — some topics should be discussed only with the woman.","tip":"Never share a person's health problem with others in the village."}]}],"quiz":[{"q":"What does ASHA stand for?","options":["Accredited Social Health Activist","Assistant Sub-centre Health Aide","Anganwadi School Health Assistant","Area Service Health Agent"],"answer":0,"explain":"ASHA = Accredited Social Health Activist."},{"q":"Where is VHSND (Village Health, Sanitation and Nutrition Day) usually held?","options":["At the district hospital","At the Anganwadi centre","In a private clinic","In the school only"],"answer":1,"explain":"VHSND is held every month at the Anganwadi with the ANM and AWW."},{"q":"Who is the member-secretary or convenor of the VHSNC?","options":["The doctor","The ASHA","The police","The teacher"],"answer":1,"explain":"The ASHA is the member-secretary or convenor of the VHSNC."},{"q":"Which is the best way to check that a mother understood your advice?","options":["Ask 'Did you understand?'","Ask her to repeat the message in her own words","Give her a paper","Say it again louder"],"answer":1,"explain":"Asking her to repeat it back (teach-back) shows what she really understood."},{"q":"When should you write in your register?","options":["At the end of the year","The same day as the visit","Only before the meeting","Only when asked"],"answer":1,"explain":"Write the same day so the record is correct."}]},{"id":"eeo","icon":"visibility","color":"#00838F","title":"Eye, Ear, Mouth & Palliative Care","subtitle":"Eye care, hearing, oral health and care of bedridden patients","lessons":[{"id":"eeo.eye","icon":"visibility","title":"Eye care","cards":[{"icon":"elderly","title":"Cataract","text":"Cataract makes vision cloudy, mostly in older people. The black centre of the eye may look white or grey. Cataract surgery is free at government hospitals under the National Programme for Control of Blindness and Visual Impairment.","tip":"Make a list of elderly people who cannot see well and help them reach the eye camp."},{"icon":"child_care","title":"Children's eyes","text":"A child who holds books very close, squints, sits close to the TV, or has watery eyes and headaches may need glasses. Refer for eye testing. A white spot in the pupil of a baby or crossed eyes also need referral.","tip":"Glasses for school children are given free under the school eye programme."},{"icon":"warning","title":"Eye injury and red eye","text":"If something enters the eye, wash it with plenty of clean water. Do not rub. Do not put kajal, oil, milk or any home remedy in the eye. Refer eye injuries, a painful red eye or sudden loss of vision at once.","tip":"People with diabetes should get their eyes checked every year."}]},{"id":"eeo.ent","icon":"hearing","title":"Ear and hearing care","cards":[{"icon":"child_friendly","title":"Hearing in babies","text":"A baby should startle at loud sounds from birth and turn towards sounds by about 6 months. If not, refer for a hearing test. Early help lets the child learn to speak.","tip":"Newborn hearing screening is done under RBSK."},{"icon":"healing","title":"Ear discharge","text":"Pus or fluid coming from the ear needs a doctor. Do not put oil, hot water or any liquid in the ear. Keep the ear dry. Do not clean ears with sticks, pins or matchsticks.","tip":"Untreated ear discharge can lead to deafness."},{"icon":"elderly","title":"Hearing loss in adults","text":"Elderly people who speak loudly, ask for things to be repeated or keep the TV very loud may have hearing loss. Refer them for testing; hearing aids can help. Protect ears from very loud noise.","tip":"Face the person and speak clearly — do not shout."}]},{"id":"eeo.oral","icon":"dentistry","title":"Oral health","cards":[{"icon":"clean_hands","title":"Healthy teeth","text":"Brush twice a day — morning and before bed — with fluoride toothpaste. Rinse the mouth after eating. Eat fewer sweets and sugary drinks. For babies, clean the gums with a soft clean cloth.","tip":"Children should not sleep with a bottle of milk or sweet drink in the mouth."},{"icon":"sick","title":"Signs to refer","text":"Refer for: tooth pain, black holes in teeth, swollen or bleeding gums, bad smell, swelling of the face, or a mouth ulcer or white or red patch that does not heal in 2 weeks.","tip":"Oral screening is done at Ayushman Arogya Mandir."},{"icon":"smoke_free","title":"Tobacco and the mouth","text":"Gutkha, mawa, khaini, bidi and cigarettes stain teeth, damage gums and cause mouth cancer. Advise every tobacco user to quit and check the mouth of tobacco users at every visit.","tip":"Quit Tobacco helpline: 1800-11-2356."}]},{"id":"eeo.palliative","icon":"bed","title":"Care of bedridden patients (palliative care)","cards":[{"icon":"bed","title":"Prevent bed sores","text":"Change the patient's position every 2 hours. Keep the skin clean and dry. Use soft padding under the back, hips and heels. Check the skin every day for red areas. Give enough food and water.","tip":"A red area that does not go away is the start of a bed sore. Tell the ANM."},{"icon":"medication","title":"Pain and comfort","text":"Pain can be treated. Tell the MO if the patient has pain, breathlessness, vomiting or cannot sleep. Keep the mouth clean and moist. Help with toilet needs gently and keep the patient's dignity.","tip":"Palliative care is for the patient and the family."},{"icon":"favorite","title":"Support the family","text":"Caring for a bedridden person is tiring. Teach the family how to turn the patient, clean and feed. Listen to their worries. Link them to the home-based palliative care team where available.","tip":"Your regular visit itself is a big support."}]}],"quiz":[{"q":"Cataract surgery at government hospitals is:","options":["Very costly","Free","Only for children","Not available"],"answer":1,"explain":"It is free under the national blindness control programme."},{"q":"Something has entered a person's eye. First aid is:","options":["Put kajal","Rub the eye","Wash with plenty of clean water","Put oil"],"answer":2,"explain":"Wash with clean water. Do not rub or put anything in the eye."},{"q":"A child has pus coming from the ear. You should:","options":["Put warm oil","Clean with a stick","Keep ear dry and refer to doctor","Ignore it"],"answer":2,"explain":"Keep the ear dry and refer. Nothing should be put in the ear."},{"q":"How often should teeth be brushed?","options":["Once a week","Twice a day","Once a month","Only when painful"],"answer":1,"explain":"Brush in the morning and before bed with fluoride toothpaste."},{"q":"To prevent bed sores, the patient's position should be changed every:","options":["2 hours","12 hours","2 days","Week"],"answer":0,"explain":"Turn the patient every 2 hours and keep the skin clean and dry."}]},{"id":"life","icon":"restaurant","color":"#6D4C41","title":"Nutrition, Sanitation & Healthy Habits","subtitle":"Balanced diet, toilets and hygiene, tobacco and alcohol, physical activity","lessons":[{"id":"life.diet","icon":"restaurant","title":"Balanced diet","cards":[{"icon":"restaurant","title":"A healthy plate","text":"Every meal should have: cereals (rice, roti, millets like bajra and jowar), pulses or beans, vegetables and fruits, and milk or curd. Add eggs, fish or meat if the family eats them. Use little oil, sugar and salt.","tip":"The more colours on the plate, the more nutrients."},{"icon":"science","title":"Iodised salt","text":"Use only iodised salt. Iodine protects a child's brain development and prevents goitre. Store salt in a closed container away from heat and damp.","tip":"Check the packet for 'Iodised' written on it."},{"icon":"child_care","title":"Anganwadi food (POSHAN)","text":"Under POSHAN Abhiyaan, pregnant women, breastfeeding mothers and children 6 months to 6 years get take-home ration or hot cooked meals from the Anganwadi. Make sure every eligible family is registered.","tip":"Take-home ration is for the mother or child, not for the whole family."}]},{"id":"life.wash","icon":"clean_hands","title":"Toilets and hygiene","cards":[{"icon":"home","title":"Use a toilet always","text":"Every family member should use a toilet, every time. Open defecation spreads diarrhoea, worms and typhoid. Children's stool should also be put in the toilet. Keep the toilet clean and use water after use.","tip":"Help families apply for toilet support under Swachh Bharat Mission."},{"icon":"clean_hands","title":"Handwashing steps","text":"Wet hands, apply soap, rub palms, back of hands, between fingers, backs of fingers, thumbs and fingertips, then wrists. Rinse and dry with a clean cloth. It should take about 40 seconds.","tip":"Wash hands before eating, before cooking, before feeding a child, and after toilet."},{"icon":"water","title":"Clean surroundings","text":"Do not let water collect near the house — it breeds mosquitoes. Put garbage in a pit or dustbin, keep wet and dry waste separate, and keep animals' shelters away from the kitchen.","tip":"Plan a village cleaning day with the VHSNC."}]},{"id":"life.tobacco","icon":"smoke_free","title":"Tobacco and alcohol","cards":[{"icon":"smoke_free","title":"Tobacco harms","text":"All tobacco — bidi, cigarette, gutkha, mawa, khaini, snuff — causes cancer, heart attack, stroke, TB and lung disease. Smokeless tobacco is not safe. Smoke also harms children and pregnant women at home.","tip":"Quit Tobacco helpline: 1800-11-2356 (free)."},{"icon":"campaign","title":"Help people quit — 5 A's","text":"Ask every adult about tobacco use. Advise them clearly to quit. Assess if they are ready. Assist — help them set a quit date and handle cravings. Arrange follow-up and refer to the tobacco cessation centre.","tip":"Most people need several tries to quit. Keep encouraging."},{"icon":"info","title":"Tobacco law and alcohol","text":"By law (COTPA), smoking in public places is banned and tobacco cannot be sold to people under 18 or within 100 yards of a school. Alcohol harms the liver, heart and family life, and leads to accidents and violence. Refer people who want to stop drinking to the MO.","tip":"Tele-MANAS 14416 can also help with addiction."}]},{"id":"life.active","icon":"directions_walk","title":"Physical activity and healthy weight","cards":[{"icon":"directions_walk","title":"Move every day","text":"Adults should do at least 30 minutes of brisk walking, cycling, yoga or other activity on at least 5 days a week. Children should play actively for at least 1 hour every day.","tip":"Walking together in a group makes it easier to continue."},{"icon":"scale","title":"Waist size and risk","text":"A waist of more than 80 cm in women or more than 90 cm in men increases the risk of diabetes, high BP and heart disease. Measure the waist at the level of the navel while filling CBAC.","tip":"Losing even a little weight lowers the risk."},{"icon":"wb_sunny","title":"Sleep and stress","text":"Adults need 7 to 8 hours of sleep. Less screen time, time with family, yoga and breathing exercises reduce stress. Too much mobile use is harmful for children's eyes, sleep and studies.","tip":"Set a no-mobile time at meals and before bed."}]}],"quiz":[{"q":"Which salt should families use?","options":["Any salt","Iodised salt","Rock salt only","No salt"],"answer":1,"explain":"Iodised salt protects brain development and prevents goitre."},{"q":"How long should proper handwashing with soap take?","options":["5 seconds","About 40 seconds","5 minutes","Only a quick rinse"],"answer":1,"explain":"About 40 seconds, covering all parts of the hands."},{"q":"Which of these tobacco products is safe?","options":["Gutkha","Khaini","Bidi","None of them"],"answer":3,"explain":"No tobacco product is safe."},{"q":"What is the Quit Tobacco helpline number?","options":["108","1800-11-2356","14416","1098"],"answer":1,"explain":"1800-11-2356 is the free Quit Tobacco helpline."},{"q":"How much physical activity should adults do?","options":["30 minutes on at least 5 days a week","10 minutes once a week","Only on holidays","None needed after 40"],"answer":0,"explain":"At least 30 minutes on 5 or more days a week."},{"q":"A woman's waist is 92 cm. This means:","options":["Normal","Higher risk of diabetes and BP","She is underweight","Only a clothing issue"],"answer":1,"explain":"Waist above 80 cm in women increases risk."}]}]},"hi":{"language":"hi","modules":[{"id":"mnh","title":"माँ और नवजात शिशु की देखभाल","subtitle":"गर्भावस्था की देखभाल, सुरक्षित प्रसव, नवजात देखभाल और परिवार नियोजन","lessons":[{"id":"mnh.anc","title":"गर्भावस्था पंजीकरण और जाँच","cards":[{"title":"जल्दी पंजीकरण","text":"गर्भ की पुष्टि होते ही, पहले 12 हफ्तों के अंदर हर गर्भवती महिला का पंजीकरण करें। MCP (माँ-बच्चा सुरक्षा) कार्ड भरकर उसे दें। हर जाँच पर वह यह कार्ड साथ लाए।","tip":"जल्दी पंजीकरण = जल्दी देखभाल। नई ब्याही महिलाओं से मिलें और माहवारी रुकने के बारे में पूछें।"},{"title":"कम से कम 4 जाँच","text":"हर गर्भवती महिला की कम से कम 4 प्रसव-पूर्व जाँच (ANC) होनी चाहिए। पहली जाँच पहले 3 महीनों में। दूसरी और तीसरी तिमाही में हर महीने की 9 तारीख को डॉक्टर द्वारा PMSMA जाँच के लिए भी प्रेरित करें।","tip":"अपने क्षेत्र की सभी गर्भवती महिलाओं और उनकी अगली जाँच की तारीख की सूची रखें।"},{"title":"ANC में क्या जाँचा जाता है","text":"वज़न, ब्लड प्रेशर, हीमोग्लोबिन (Hb), पेशाब की जाँच, ब्लड शुगर, पेट की जाँच से बच्चे की बढ़त, और HIV व सिफलिस की खून की जाँच। Hb 11 g/dl से कम होना मतलब खून की कमी (एनीमिया)।","tip":"BP 140/90 या उससे ज़्यादा हो तो वह ऊँचा है। डॉक्टर के पास भेजें।"},{"title":"गोलियाँ और टीके","text":"पहले 3 महीनों में फोलिक एसिड। चौथे महीने से: रोज़ 1 IFA (आयरन) गोली कम से कम 180 दिन और रोज़ 2 कैल्शियम गोली। दूसरी तिमाही में एक एल्बेंडाज़ोल (कृमिनाशक) गोली। Td टीका: 2 खुराक (या पिछले 3 साल में लगा हो तो 1 बूस्टर)।","tip":"आयरन और कैल्शियम अलग-अलग समय पर लें। आयरन की गोली नींबू पानी के साथ बेहतर असर करती है; चाय के साथ नहीं।"},{"title":"भोजन और आराम","text":"उसे रोज़ एक बार ज़्यादा खाना खाना चाहिए: हरी पत्तेदार सब्ज़ियाँ, दालें, दूध, अंडा या मांस (यदि खाती हो), और फल। दिन में 2 घंटे आराम और रात में 8 घंटे नींद ज़रूरी है। तंबाकू या शराब बिल्कुल नहीं।","tip":"सिर्फ महिला से नहीं, पूरे परिवार से बात करें।"}]},{"id":"mnh.danger","title":"गर्भावस्था के खतरे के लक्षण","cards":[{"title":"खून आना","text":"गर्भावस्था में योनि से किसी भी तरह का खून आना खतरनाक है। उसे तुरंत अस्पताल भेजें।","tip":"मुफ्त एम्बुलेंस के लिए 108 या 102 पर कॉल करें।"},{"title":"सिरदर्द, धुंधला दिखना, दौरे","text":"तेज़ सिरदर्द, धुंधला दिखना, चेहरे और हाथों पर सूजन, या दौरे (झटके) गर्भावस्था में हाई BP (प्री-एक्लेम्पसिया / एक्लेम्पसिया) के लक्षण हैं। इससे माँ और बच्चे की जान जा सकती है।","tip":"इंतज़ार न करें। तुरंत डॉक्टर वाले अस्पताल में भेजें।"},{"title":"बुखार, साँस फूलना, पीलापन","text":"तेज़ बुखार, साँस फूलना, आँखें, जीभ और नाखून बहुत पीले/सफेद होना (गंभीर एनीमिया) — तुरंत इलाज चाहिए।","tip":"गंभीर एनीमिया (Hb 7 से कम) का इलाज अस्पताल में होना चाहिए।"},{"title":"बच्चे की हलचल कम, पानी रिसना","text":"अगर बच्चे की हलचल कम हो जाए या बंद हो जाए, या प्रसव पीड़ा से पहले योनि से पानी रिसने लगे, तो तुरंत अस्पताल जाना चाहिए। 12 घंटे से ज़्यादा चलने वाली प्रसव पीड़ा भी खतरनाक है।","tip":"पहली मुलाकात में ही हर परिवार को ये खतरे के लक्षण सिखाएँ।"}]},{"id":"mnh.birth","title":"प्रसव की तैयारी और सुरक्षित प्रसव","cards":[{"title":"प्रसव योजना बनाएँ","text":"पहले से तय करें: कौन सा अस्पताल, वहाँ कैसे पहुँचें (108/102 नंबर), साथ कौन जाएगा, आपातकाल के लिए पैसे, और परिवार से एक खून देने वाला।","tip":"फ़ोन नंबर MCP कार्ड पर लिख दें।"},{"title":"प्रसव केवल अस्पताल में","text":"हर प्रसव प्रशिक्षित स्टाफ़ वाली स्वास्थ्य संस्था में होना चाहिए। JSSK के तहत सरकारी अस्पतालों में प्रसव, दवाइयाँ, जाँच, भोजन, खून और आने-जाने का साधन मुफ्त है। JSY के तहत माँ को नकद सहायता मिलती है।","tip":"घर पर प्रसव से माँ और बच्चे की मौत का खतरा बढ़ता है।"},{"title":"48 घंटे रुकें","text":"सामान्य प्रसव के बाद माँ और बच्चे को कम से कम 48 घंटे अस्पताल में रहना चाहिए। ज़्यादा खून बहने जैसे अधिकतर खतरे पहले 2 दिनों में होते हैं।","tip":"जिस दिन माँ घर लौटे, उसी दिन घर पर मिलने जाएँ।"},{"title":"प्रसव के बाद खतरे के लक्षण","text":"ज़्यादा खून बहना, बुखार, बदबूदार स्राव, पेट में तेज़ दर्द, दौरे, या बहुत उदास रहना और बच्चे की देखभाल न करना। तुरंत रेफर करें।","tip":"5 मिनट में 1 से ज़्यादा पैड भीग जाए तो यह ज़्यादा खून बहना है।"}]},{"id":"mnh.hbnc","title":"गृह-आधारित नवजात देखभाल (HBNC)","cards":[{"title":"HBNC गृह भ्रमण","text":"अस्पताल में प्रसव के बाद नवजात के घर दिन 3, 7, 14, 21, 28 और 42 को जाएँ। अगर बच्चा घर पर पैदा हुआ है तो दिन 1 को भी जाएँ। कम वज़न वाले बच्चों के घर ज़्यादा बार जाएँ।","tip":"हर भ्रमण पर HBNC फ़ॉर्मेट भरें।"},{"title":"1 घंटे के अंदर स्तनपान","text":"जन्म के 1 घंटे के अंदर स्तनपान शुरू करें। पहला पीला गाढ़ा दूध (खीस) बच्चे का पहला टीका है। 6 महीने तक सिर्फ माँ का दूध दें — पानी, शहद, घुट्टी या दूसरा दूध नहीं।","tip":"24 घंटे में 8-12 बार, दिन और रात, दूध पिलाएँ।"},{"title":"बच्चे को गर्म रखें","text":"बच्चे को पोंछें, साफ़ कपड़े में लपेटें, सिर ढकें और माँ के साथ रखें। त्वचा से त्वचा का संपर्क (कंगारू मदर केयर) सबसे अच्छा है, खासकर छोटे बच्चों के लिए। पहला स्नान देर से कराएँ।","tip":"नाल को साफ़ और सूखा रखें। उस पर कुछ भी न लगाएँ।"},{"title":"बच्चे का वज़न लें","text":"हर नवजात का वज़न लें। 2.5 किलो से कम वज़न वाला बच्चा कम वज़न का है और उसे ज़्यादा देखभाल चाहिए: बार-बार दूध, KMC, और ज़्यादा भ्रमण।","tip":"1.8 किलो से कम या दूध न चूस पाने वाले बच्चे को रेफर करें।"},{"title":"नवजात के खतरे के लक्षण","text":"दूध न चूस पाना, दौरे, तेज़ साँस (1 मिनट में 60 या ज़्यादा), छाती का अंदर धँसना, शरीर बहुत ठंडा या गर्म, बच्चा बहुत सुस्त या ढीला, हथेली और तलवे पीले, या नाल लाल और मवाद वाली। तुरंत रेफर करें।","tip":"बच्चा शांत हो तब पूरे 1 मिनट तक साँस गिनें।"}]},{"id":"mnh.fp","title":"परिवार नियोजन","cards":[{"title":"अंतर क्यों ज़रूरी है","text":"दो बच्चों के बीच कम से कम 3 साल का अंतर माँ और बच्चे को स्वस्थ रखता है। पहला बच्चा 20 साल की उम्र के बाद होना चाहिए।","tip":"हो सके तो पति-पत्नी दोनों से साथ में बात करें।"},{"title":"अंतर रखने के साधन","text":"कंडोम, रोज़ की गोली (माला-N), साप्ताहिक गोली छाया, हर 3 महीने में अंतरा इंजेक्शन, और कॉपर-T (IUCD) — जो प्रसव के तुरंत बाद भी लगाई जा सकती है (PPIUCD)।","tip":"आप अपनी दवा किट से कंडोम, गोलियाँ और गर्भ जाँच किट दे सकती हैं।"},{"title":"स्थायी साधन","text":"जिन दंपतियों को और बच्चे नहीं चाहिए: महिलाओं के लिए नसबंदी और पुरुषों के लिए बिना चीरे की नसबंदी (NSV)। NSV आसान और जल्दी होती है। दोनों मुफ्त हैं और व्यक्ति को प्रोत्साहन राशि मिलती है।","tip":"भ्रम दूर करें: NSV से पुरुषों में कमज़ोरी नहीं आती।"}]}],"quiz":[{"q":"गर्भावस्था का पंजीकरण कब करना चाहिए?","options":["पहले 12 हफ्तों के अंदर","छठे महीने में","प्रसव के समय","पहली जाँच के बाद"],"explain":"पहले 12 हफ्तों (पहली तिमाही) में पंजीकरण करें ताकि देखभाल जल्दी शुरू हो।"},{"q":"गर्भवती महिला को IFA गोलियाँ कितनी लेनी चाहिए?","options":["सिर्फ कमज़ोरी लगने पर","रोज़ 1, कम से कम 180 दिन","कुल 10 गोलियाँ","सिर्फ नौवें महीने में"],"explain":"चौथे महीने से रोज़ 1 IFA गोली कम से कम 180 दिन।"},{"q":"गर्भवती महिला को तेज़ सिरदर्द और धुंधला दिख रहा है। आप क्या करेंगी?","options":["दर्द की गोली देकर इंतज़ार","घर पर आराम करने को कहेंगी","तुरंत अस्पताल रेफर करेंगी","अगले हफ्ते फिर आएँगी"],"explain":"ये प्री-एक्लेम्पसिया के लक्षण हैं। यह आपातकाल है।"},{"q":"स्तनपान कब शुरू करना चाहिए?","options":["3 दिन बाद","पहले स्नान के बाद","जन्म के 1 घंटे के अंदर","शहद देने के बाद"],"explain":"1 घंटे के अंदर शुरू करें। खीस बच्चे की रक्षा करता है।"},{"q":"नवजात 1 मिनट में 64 बार साँस ले रहा है। यह है:","options":["सामान्य","तेज़ साँस — खतरे का लक्षण","भूख का लक्षण","सोते बच्चे के लिए सामान्य"],"explain":"नवजात में 1 मिनट में 60 या ज़्यादा साँस तेज़ साँस है। रेफर करें।"},{"q":"अस्पताल में प्रसव के बाद HBNC भ्रमण किन दिनों पर होते हैं?","options":["दिन 3, 7, 14, 21, 28, 42","सिर्फ दिन 1","दिन 30 और 60","सिर्फ बच्चा बीमार होने पर"],"explain":"छह भ्रमण: दिन 3, 7, 14, 21, 28 और 42।"}]},{"id":"child","title":"बाल स्वास्थ्य और टीकाकरण","subtitle":"टीके, पोषण, दस्त, निमोनिया और बच्चे का विकास","lessons":[{"id":"child.immun","title":"टीकाकरण सारणी","cards":[{"title":"जन्म पर","text":"BCG, OPV शून्य खुराक और हेपेटाइटिस B जन्म खुराक (24 घंटे के अंदर)।","tip":"अस्पताल में जन्मे बच्चों को घर जाने से पहले ये टीके लग जाने चाहिए।"},{"title":"6, 10 और 14 हफ्ते पर","text":"6 हफ्ते: OPV-1, पेंटावेलेंट-1, रोटावायरस-1, fIPV-1, PCV-1। 10 हफ्ते: OPV-2, पेंटावेलेंट-2, रोटावायरस-2। 14 हफ्ते: OPV-3, पेंटावेलेंट-3, रोटावायरस-3, fIPV-2, PCV-2।","tip":"MCP कार्ड देखें और अगली तारीख लिखें।"},{"title":"9-12 महीने पर","text":"MR-1 (खसरा-रूबेला), fIPV-3, PCV बूस्टर, JE-1 (JE वाले ज़िलों में), और विटामिन A की पहली खुराक।","tip":"1 साल तक सभी टीके पूरे करने वाला बच्चा 'पूर्ण प्रतिरक्षित' है।"},{"title":"16-24 महीने और बाद में","text":"16-24 महीने: MR-2, JE-2, DPT बूस्टर-1, OPV बूस्टर, विटामिन A (दूसरी खुराक)। फिर 5 साल तक हर 6 महीने विटामिन A। 5-6 साल पर DPT बूस्टर-2। 10 और 16 साल पर Td।","tip":"छूटी हुई खुराक बाद में दी जा सकती है — परिवार को कभी 'बहुत देर हो गई' न कहें।"},{"title":"VHSND / सत्र के दिन आपकी भूमिका","text":"ड्यू लिस्ट बनाएँ, एक दिन पहले परिवारों को बताएँ, बच्चों को सत्र पर लाएँ, और जो नहीं आए उनका फॉलो-अप करें। टीके के बाद हल्का बुखार या दर्द सामान्य है। कोई गंभीर प्रतिक्रिया तुरंत ANM को बताएँ।","tip":"ऐसे 'शून्य-खुराक' बच्चे खोजें जिन्हें कभी कोई टीका नहीं लगा।"}]},{"id":"child.nutrition","title":"बच्चे का पोषण और विकास","cards":[{"title":"6 महीने से ऊपरी आहार","text":"6 महीने पर माँ के दूध के साथ नरम मसला हुआ खाना शुरू करें: गाढ़ी दाल-चावल, खिचड़ी, मसली सब्ज़ियाँ और फल, अंडा। 2-3 चम्मच से शुरू करें और धीरे-धीरे बढ़ाएँ। 2 साल या उससे ज़्यादा तक स्तनपान जारी रखें।","tip":"खाना इतना गाढ़ा हो कि चम्मच पर टिका रहे।"},{"title":"विकास की निगरानी","text":"हर महीने बच्चे का वज़न लें और MCP कार्ड के ग्रोथ चार्ट पर निशान लगाएँ। अगर वज़न न बढ़े या रेखा नीचे जाए, तो माँ को सलाह दें और ANM व आंगनवाड़ी कार्यकर्ता को बताएँ।","tip":"वज़न वाले दिन माँ के साथ आंगनवाड़ी जाएँ।"},{"title":"गंभीर तीव्र कुपोषण (SAM)","text":"लक्षण: बहुत दुबला बच्चा जिसकी हड्डियाँ दिखें, दोनों पैरों पर सूजन, या MUAC (बाँह की पट्टी) लाल हिस्से में — 11.5 सेमी से कम। ऐसे बच्चे को NRC (पोषण पुनर्वास केंद्र) रेफर करें।","tip":"6 महीने से 5 साल के बच्चों के लिए MUAC टेप का उपयोग करें।"},{"title":"विटामिन A, आयरन और कृमिनाशक","text":"9 महीने से 5 साल तक हर 6 महीने विटामिन A। 6 महीने से 5 साल के बच्चों को हफ्ते में दो बार IFA सिरप (एनीमिया मुक्त भारत)। 1 साल से हर 6 महीने एल्बेंडाज़ोल (राष्ट्रीय कृमि मुक्ति दिवस)।","tip":"1-2 साल के बच्चे को कृमिनाशक की आधी गोली, पीसकर दें।"}]},{"id":"child.diarrhoea","title":"दस्त: ORS और ज़िंक","cards":[{"title":"हर दस्त में ORS","text":"दिन में 3 या ज़्यादा पतले दस्त को दस्त कहते हैं। हर पतले दस्त के बाद ORS दें। एक पैकेट 1 लीटर साफ़ पीने के पानी में घोलें। बना हुआ घोल 24 घंटे के अंदर इस्तेमाल करें।","tip":"माँ को ORS बनाना दिखाएँ — फिर उसे खुद बनाने दें।"},{"title":"14 दिन ज़िंक","text":"14 दिन तक ज़िंक दें, भले ही दस्त पहले रुक जाएँ। 2-6 महीने का बच्चा: रोज़ आधी गोली (10 mg)। 6 महीने से 5 साल: रोज़ 1 गोली (20 mg)। माँ के दूध या पानी में घोलकर दें।","tip":"ज़िंक दस्त का समय कम करता है और अगले महीनों में दस्त से बचाता है।"},{"title":"खिलाना जारी रखें","text":"दस्त में स्तनपान और सामान्य खाना जारी रखें। ज़्यादा तरल दें। खाना बंद न करें।","tip":"दस्त के बाद 2 हफ्ते तक रोज़ एक बार ज़्यादा खाना दें।"},{"title":"कब रेफर करें","text":"अगर बच्चा बहुत सुस्त हो, पी न सके, आँखें धँसी हों, चुटकी से पकड़ी त्वचा बहुत धीरे वापस जाए, मल में खून हो, या 14 दिन या ज़्यादा से दस्त हों तो रेफर करें।","tip":"साबुन और साफ़ पानी से हाथ धोने से दस्त से बचाव होता है।"}]},{"id":"child.pneumonia","title":"बच्चों में निमोनिया","cards":[{"title":"साँस गिनें","text":"अगर बच्चे को खाँसी या साँस लेने में तकलीफ़ है, तो पूरे 1 मिनट साँस गिनें। तेज़ साँस है: 60 या ज़्यादा (2 महीने से कम), 50 या ज़्यादा (2-12 महीने), 40 या ज़्यादा (1-5 साल)।","tip":"बच्चा शांत हो या सो रहा हो तब गिनें।"},{"title":"छाती धँसना और खतरे के लक्षण","text":"अगर साँस लेते समय निचली छाती अंदर धँसती है, तो यह गंभीर निमोनिया है। ये भी खतरनाक हैं: पी न पाना, दौरे, बहुत सुस्ती, या सब कुछ उल्टी कर देना।","tip":"तुरंत रेफर करें। रास्ते में बच्चे को गर्म रखें और स्तनपान जारी रखें।"},{"title":"इलाज और बचाव","text":"तेज़ साँस में ANM या डॉक्टर से एंटीबायोटिक इलाज ज़रूरी है, आपके राज्य की गाइडलाइन के अनुसार। स्तनपान, पूरा टीकाकरण (PCV सहित) और धुआँ-रहित घर से निमोनिया से बचाव होता है।","tip":"चूल्हे का धुआँ हानिकारक है। बच्चों को चूल्हे से दूर रखें।"}]},{"id":"child.hbyc","title":"गृह-आधारित छोटे बच्चे की देखभाल (HBYC)","cards":[{"title":"HBYC भ्रमण","text":"HBNC के बाद बच्चे के घर 3, 6, 9, 12 और 15 महीने पर जाएँ। विकास, टीके, खान-पान, घर में ORS और ज़िंक, और खेल व बातचीत की जाँच करें।","tip":"HBYC चेकलिस्ट का उपयोग करें।"},{"title":"खेलें और बात करें","text":"बच्चे खेलकर और बात करके सीखते हैं। माता-पिता को कहें कि रोज़ बच्चे से बात करें, गाना गाएँ, खेलें, और बच्चे की आवाज़ और मुस्कान का जवाब दें।","tip":"कटोरी और चम्मच जैसी घरेलू चीज़ें अच्छे खिलौने हैं।"},{"title":"देरी को जल्दी पहचानें","text":"अगर बच्चा 3 महीने तक मुस्कुराए नहीं, 9 महीने तक बैठ न सके, या 18 महीने तक चल न सके या शब्द न बोले, तो RBSK टीम या DEIC को रेफर करें।","tip":"जल्दी मदद से सबसे अच्छे परिणाम मिलते हैं।"}]}],"quiz":[{"q":"जन्म पर कौन से टीके लगते हैं?","options":["MR और JE","BCG, OPV-0, हेपेटाइटिस B","पेंटावेलेंट-1 और PCV-1","Td"],"explain":"BCG, OPV शून्य खुराक और हेपेटाइटिस B जन्म खुराक।"},{"q":"MR-1 (खसरा-रूबेला) कब दिया जाता है?","options":["जन्म पर","6 हफ्ते पर","9-12 महीने पर","5 साल पर"],"explain":"MR-1 9-12 महीने पर, MR-2 16-24 महीने पर।"},{"q":"दस्त में ज़िंक कितने दिन दिया जाता है?","options":["3 दिन","7 दिन","14 दिन","सिर्फ दस्त रुकने तक"],"explain":"14 दिन तक ज़िंक, भले ही दस्त पहले रुक जाएँ।"},{"q":"1 साल का बच्चा 1 मिनट में 48 बार साँस लेता है। यह है:","options":["तेज़ साँस","सामान्य","धीमी साँस","सिर्फ ज़ुकाम"],"explain":"1-5 साल के बच्चे में 1 मिनट में 40 या ज़्यादा साँस तेज़ साँस है। 48 तेज़ है — रेफर करें।"},{"q":"बच्चे का MUAC 11.5 सेमी से कम होने का मतलब:","options":["सामान्य विकास","गंभीर तीव्र कुपोषण — NRC रेफर करें","बच्चे का वज़न ज़्यादा है","सिर्फ विटामिन चाहिए"],"explain":"MUAC 11.5 सेमी से कम (लाल हिस्सा) SAM है।"},{"q":"ऊपरी आहार कब शुरू करना चाहिए?","options":["2 महीने पर","4 महीने पर","6 महीने पर","1 साल पर"],"explain":"6 महीने तक सिर्फ माँ का दूध, फिर स्तनपान के साथ नरम खाना।"}]},{"id":"cd","title":"संचारी रोग","subtitle":"टीबी, कुष्ठ रोग, रेबीज़, पानी से होने वाले रोग और प्रकोप","lessons":[{"id":"cd.tb","title":"क्षय रोग (टीबी)","cards":[{"title":"टीबी के लक्षण","text":"2 हफ्ते या ज़्यादा से खाँसी, खासकर शाम को बुखार, वज़न कम होना, रात को पसीना, भूख न लगना, या बलगम में खून। टीबी ग्रंथियों, हड्डियों और शरीर के दूसरे हिस्सों में भी हो सकती है।","tip":"इनमें से कोई एक लक्षण = संभावित टीबी। जाँच के लिए भेजें।"},{"title":"जाँच मुफ्त है","text":"स्वास्थ्य केंद्र पर बलगम का नमूना (माइक्रोस्कोपी या NAAT जाँच) देने में व्यक्ति की मदद करें। छाती का एक्स-रे भी हो सकता है। सरकारी संस्थाओं में जाँच और इलाज मुफ्त है।","tip":"नमूना सुबह-सुबह लें।"},{"title":"इलाज पूरा करें","text":"टीबी पूरी तरह ठीक हो सकती है। इलाज कम से कम 6 महीने चलता है। अच्छा महसूस होने पर मरीज़ दवा बंद न करे। उपचार सहायक के रूप में सुनिश्चित करें कि मरीज़ रोज़ दवा ले।","tip":"इलाज जल्दी छोड़ने से दवा-प्रतिरोधी टीबी हो सकती है।"},{"title":"मरीज़ों को सहायता","text":"हर टीबी मरीज़ को निक्षय पोषण योजना के तहत हर महीने पोषण सहायता (बैंक खाते में) मिलती है। परिवार के सदस्यों और नज़दीकी संपर्कों की जाँच कराएँ; उन्हें टीबी से बचाव का इलाज मिल सकता है।","tip":"मरीज़ का बैंक खाता नि-क्षय पर जोड़ने में मदद करें।"}]},{"id":"cd.leprosy","title":"कुष्ठ रोग","cards":[{"title":"कुष्ठ रोग के लक्षण","text":"त्वचा पर हल्का सफेद या लाल दाग जिसमें सुन्नपन हो (छूने, दर्द या गर्मी का अहसास न हो)। मोटी चमकदार त्वचा, हाथ-पैर में सुन्नपन या कमज़ोरी भी।","tip":"दाग को रुई से हल्का छूकर अहसास की जाँच करें।"},{"title":"MDT से मुफ्त इलाज","text":"कुष्ठ रोग मल्टी-ड्रग थेरेपी (MDT) से ठीक होता है, जो सरकारी संस्थाओं में मुफ्त है। जल्दी इलाज से विकलांगता से बचाव होता है। पहली खुराक के बाद मरीज़ से संक्रमण नहीं फैलता।","tip":"कुष्ठ रोग पाप या श्राप से नहीं होता। भेदभाव दूर करें।"},{"title":"स्वयं देखभाल","text":"सुन्न हाथ-पैर वाले मरीज़ रोज़ घाव की जाँच करें, पानी में भिगोएँ और त्वचा पर तेल लगाएँ, और सुरक्षित जूते-चप्पल पहनें।","tip":"नई कमज़ोरी, नसों में दर्द या आँख लाल होने पर रेफर करें।"}]},{"id":"cd.rabies","title":"कुत्ते का काटना और रेबीज़","cards":[{"title":"रेबीज़ जानलेवा है — पर बचाव संभव है","text":"रेबीज़ संक्रमित कुत्ते, बिल्ली, बंदर या दूसरे जानवर के काटने, खरोंचने या कटी त्वचा पर चाटने से फैलता है। लक्षण शुरू होने के बाद लगभग हमेशा मौत होती है। सही प्राथमिक उपचार और टीका पूरी तरह बचाते हैं।","tip":"किसी भी जानवर के काटने को नज़रअंदाज़ न करें, छोटी खरोंच को भी नहीं।"},{"title":"घाव को तुरंत धोएँ","text":"घाव को साबुन और खूब बहते पानी से 15 मिनट धोएँ। फिर पोविडोन-आयोडीन जैसा एंटीसेप्टिक लगाएँ। मिर्च, तेल, हल्दी या चूना न लगाएँ। टाँके न लगाएँ और कसकर पट्टी न बाँधें।","tip":"अच्छी तरह धोने से ज़्यादातर वायरस निकल जाता है।"},{"title":"उसी दिन टीका","text":"व्यक्ति को उसी दिन एंटी-रेबीज़ टीके (ARV) के लिए स्वास्थ्य केंद्र भेजें। दी गई तारीखों पर सभी खुराक पूरी करें। गहरे घाव या सिर, चेहरे या हाथों पर काटने में रेबीज़ इम्यूनोग्लोबुलिन (RIG) भी चाहिए।","tip":"सरकारी संस्थाओं में टीका मुफ्त है। हर तारीख याद दिलाएँ।"}]},{"id":"cd.water","title":"पानी से होने वाले रोग और प्रकोप","cards":[{"title":"सुरक्षित पीने का पानी","text":"दस्त, हैज़ा, टाइफाइड और पीलिया (हेपेटाइटिस A और E) गंदे पानी और खाने से फैलते हैं। उबला या क्लोरीन मिला पानी पिएँ। पानी ढककर रखें और डंडीदार लोटे से निकालें।","tip":"ANM की सलाह के अनुसार पानी में क्लोरीन की गोली डालें।"},{"title":"हाथ धोना","text":"साबुन और पानी से 40 सेकंड हाथ धोएँ: खाना बनाने से पहले, खाने से पहले, बच्चे को खिलाने से पहले, और शौचालय के बाद या बच्चे को साफ़ करने के बाद।","tip":"हमेशा शौचालय का उपयोग करें। खुले में शौच नहीं।"},{"title":"असामान्य मामलों की सूचना दें","text":"अगर गाँव में एक साथ कई लोगों को एक जैसी बीमारी हो — बुखार, दस्त, पीलिया, दाने — तो तुरंत ANM और PHC को बताएँ। इससे प्रकोप को जल्दी रोका जा सकता है (IDSP)।","tip":"किसी अज्ञात बीमारी से हुई मौत की भी सूचना दें।"}]}],"quiz":[{"q":"एक आदमी को 3 हफ्ते से खाँसी है और वज़न घटा है। आप क्या करेंगी?","options":["खाँसी की सिरप देंगी","टीबी के लिए बलगम जाँच भेजेंगी","एक महीना और इंतज़ार","आराम करने को कहेंगी"],"explain":"2 हफ्ते या ज़्यादा की खाँसी = संभावित टीबी। जाँच कराएँ।"},{"q":"टीबी का इलाज कम से कम कितने समय चलता है?","options":["1 हफ्ता","1 महीना","6 महीने","खाँसी रुकने तक"],"explain":"कम से कम 6 महीने। जल्दी न छोड़ें।"},{"q":"सुन्नपन वाला त्वचा का दाग किसका लक्षण हो सकता है?","options":["एलर्जी","कुष्ठ रोग","डेंगू","मलेरिया"],"explain":"सुन्नपन वाला दाग कुष्ठ रोग का मुख्य लक्षण है।"},{"q":"कुत्ते के काटने पर प्राथमिक उपचार क्या है?","options":["मिर्च पाउडर लगाना","कसकर पट्टी बाँधना","साबुन और बहते पानी से 15 मिनट धोना","छोटा घाव हो तो कुछ न करना"],"explain":"15 मिनट धोएँ, एंटीसेप्टिक लगाएँ, और उसी दिन टीका लगवाएँ।"},{"q":"एक गली में एक ही दिन पाँच लोगों को दस्त हो गए। आपको:","options":["तुरंत ANM और PHC को बताना","इंतज़ार करना","सिर्फ सरपंच को बताना","सबको एंटीबायोटिक देना"],"explain":"एक साथ कई मामले प्रकोप हो सकते हैं। जल्दी सूचना दें।"}]},{"id":"vbd","title":"वेक्टर जनित रोग (NVBDCP)","subtitle":"मलेरिया, डेंगू, चिकनगुनिया, फाइलेरिया,
